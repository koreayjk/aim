<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>@IM — 의뢰·프로젝트 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#eef2f9;--panel:#fff;--ink:#15294d;--ink2:#3e4a5b;--muted:#6e7891;--line:#dde3ec;--navy:#1f3f73;--navy2:#15294d;--soft:#e9eef7;--err:#c0392b}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard','Hanken Grotesk','Noto Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--ink);line-height:1.5;word-break:keep-all}
h1,h2,h3{font-family:'Fraunces','Pretendard',serif}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
.blogo{height:32px;border-radius:8px;display:block}
.brandrow{display:flex;align-items:center;gap:11px}
.gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:80;padding:24px}
.gate .box{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:42px 34px;max-width:380px;width:100%;text-align:center;box-shadow:0 40px 80px -44px rgba(25,34,49,.5)}
.gate h1{font-size:1.35rem;font-weight:600;margin:16px 0 4px}
.gate p{color:var(--muted);font-size:.88rem;margin-bottom:20px}
.gate input{width:100%;font-size:1rem;padding:12px 14px;border:1px solid var(--line);border-radius:11px}
.gate input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(31,63,115,.12)}
.gate button{width:100%;margin-top:11px;background:var(--navy);color:#fff;border:none;font-weight:700;padding:12px;border-radius:11px;font-size:1rem}
.gate .err{color:var(--err);font-size:.84rem;margin-top:9px;min-height:18px}
.app{display:none}
.app.show{display:grid;grid-template-columns:212px minmax(0,1fr);max-width:1780px;margin:0 auto;min-height:100vh;align-items:start}
.side{position:sticky;top:0;align-self:stretch;height:100vh;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:6px}
.side-brand{padding:2px 6px 14px}
.side-nav{display:flex;flex-direction:column;gap:4px}
.side-nav button{text-align:left;border:none;background:transparent;color:var(--ink2);font-weight:700;font-size:.93rem;padding:11px 14px;border-radius:12px;cursor:pointer;transition:.15s;width:100%}
.side-nav button:hover{background:var(--soft)}
.side-nav button.on{background:var(--navy);color:#fff}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:7px;padding-top:12px;border-top:1px solid var(--line)}
.side-foot .btn-s{width:100%;text-align:left}
.main{padding:20px 26px;min-width:0}
.main-top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.main-actions{display:flex;align-items:center;gap:10px}
@media(max-width:820px){
  .app.show{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;border-right:none;border-bottom:1px solid var(--line)}
  .side-brand{padding:2px 6px}
  .side-nav{flex-direction:row;flex-wrap:wrap}
  .side-nav button{width:auto}
  .side-foot{margin-top:0;border-top:none;flex-direction:row;padding-top:0;margin-left:auto}
  .side-foot .btn-s{width:auto}
  .main{padding:16px}
}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:6px 2px 14px;flex-wrap:wrap}
.btn-s{background:var(--panel);border:1px solid var(--line);border-radius:30px;padding:8px 15px;font-weight:600;font-size:.84rem;color:var(--ink2)}
.btn-s:hover{border-color:var(--navy);color:var(--navy)}
.btn-p{background:var(--navy);color:#fff;border:none;border-radius:30px;padding:9px 17px;font-weight:700;font-size:.85rem}
.btn-p:hover{background:var(--navy2)}
.summary{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.scard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 18px;min-width:110px}
.scard .n{font-family:'Fraunces',serif;font-size:1.5rem;font-weight:600;color:var(--navy)}
.scard .l{font-size:.78rem;color:var(--muted);font-weight:600}
.scard.warn .n{color:#b9760a}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.tabs{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:30px;padding:3px}
.tabs button{border:none;background:transparent;color:var(--muted);font-weight:700;font-size:.85rem;padding:8px 18px;border-radius:24px}
.tabs button.on{background:var(--navy);color:#fff}
.tools{display:flex;gap:9px;align-items:center}
.badge{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.st-대기{background:#eceff3;color:#5b6675}.st-견적발송{background:#e0e9f7;color:#1f3f73}.st-검토완료{background:#e7f0fb;color:#2266b8}.st-제작중{background:#fff2dd;color:#b9760a}
.st-제작완료{background:#e7f6ec;color:#1e8a4c}.st-컨펌{background:#efe9fb;color:#6a48c0}.st-확정{background:#1f3f73;color:#fff}
.st-접수{background:#eceff3;color:#5b6675}.st-견적{background:#e0e9f7;color:#1f3f73}.st-완료{background:#1f3f73;color:#fff}
.st-접수·견적{background:#eceff3;color:#5b6675}.st-디자인{background:#efe9fb;color:#6a48c0}.st-개발{background:#e0e9f7;color:#1f3f73}.st-검수{background:#fff2dd;color:#b9760a}
.st-진행중{background:#e0e9f7;color:#1f3f73}.st-기획{background:#e7f0fb;color:#2266b8}.st-시안{background:#efe9fb;color:#6a48c0}.st-수정{background:#fff2dd;color:#b9760a}.st-테스트{background:#e7f6ec;color:#1e8a4c}.st-인쇄·납품{background:#e7f0fb;color:#2266b8}
.btype{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:30px;padding:3px;margin-bottom:12px}
.btype button{border:none;background:transparent;color:var(--muted);font-weight:700;font-size:.83rem;padding:7px 15px;border-radius:24px;cursor:pointer}
.btype button.on{background:var(--navy);color:#fff}
.src{font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:6px}
.src-web{background:var(--soft);color:var(--navy)}.src-manual{background:#fdeede;color:#a86412}
.listwrap{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.lrow{display:grid;grid-template-columns:34px 1fr 96px 90px 110px 96px;gap:12px;align-items:center;padding:9px 18px;border-bottom:1px solid var(--line);cursor:pointer;font-size:.9rem}
.lrow:last-child{border-bottom:none}
.lrow:hover{background:#fafbf8}
.lrow.head{background:#fafbf8;font-weight:700;color:var(--muted);font-size:.76rem;text-transform:uppercase;letter-spacing:.5px;cursor:default}
.lrow .org{font-weight:700;font-size:.95rem;display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;justify-content:flex-start;gap:8px;min-width:0;text-align:left;padding:0}
.lrow .org .org-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .org .org-meta{font-weight:400;font-size:.78rem;white-space:nowrap;flex:0 0 auto}
.lrow .org .src{flex:0 0 auto}
.lrow .idx{font-family:'Fraunces',serif;color:var(--muted)}
.dim{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:50px}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding-bottom:10px}
.donemore{width:100%;margin-top:4px;background:#fff;border:1px dashed var(--line);border-radius:10px;padding:9px;font-size:.8rem;font-weight:700;color:var(--navy);cursor:pointer}
.donebar{margin-top:14px;background:#f3f6fb;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.donebar.drag{outline:2px dashed var(--navy);outline-offset:-4px}
.donebar-h{display:flex;align-items:center;gap:10px;font-size:.86rem;font-weight:700;color:var(--ink2);margin-bottom:10px}
.donebar-h b{color:var(--navy)}
.donebar-h .donemore{width:auto;margin:0 0 0 auto;padding:5px 11px}
.donebar-list{display:flex;flex-wrap:wrap;gap:7px}
.donechip{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--ink)}
.donechip:hover{border-color:var(--navy)}
.donechip .dim{font-weight:400;font-size:.72rem}
.sdue-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.sdue-item{display:flex;flex-direction:column;gap:3px;font-size:.72rem;color:var(--muted);font-weight:600}
.sdue-item input{width:100%;box-sizing:border-box;font-size:.82rem;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fcfcfa}
.donemore:hover{border-color:var(--navy);background:var(--soft)}
@media(max-width:900px){.board{display:flex;overflow-x:auto;gap:12px}}
.flowframe{width:100%;border:0;display:block;border-radius:14px;background:#fff;box-shadow:0 12px 34px -22px rgba(0,0,0,.45);height:calc(100vh - 210px);min-height:520px}
@media(max-width:640px){.flowframe{height:calc(100dvh - 150px);min-height:70vh;border-radius:10px}}
/* 분석 대시보드 */
.insgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ins-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.ins-card h3{font-size:.9rem;font-weight:700;color:var(--ink);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.ins-wide{grid-column:1/-1}
.ins-donut{display:flex;flex-direction:column;align-items:center;text-align:center}
.ins-donut h3{align-self:flex-start}
.donutwrap{position:relative;display:flex;align-items:center;justify-content:center;margin:4px 0}
.donutc{position:absolute;text-align:center}
.donutc b{font-family:'Fraunces',serif;font-size:1.9rem;color:var(--navy);display:block;line-height:1}
.donutc span{font-size:.72rem;color:var(--muted)}
.insbar{margin-bottom:11px}
.insbar-l{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;margin-bottom:5px;color:var(--ink2)}
.insbar-t{height:8px;background:#eceff3;border-radius:8px;overflow:hidden}
.insbar-t>i{display:block;height:100%;background:var(--navy);border-radius:8px}
.insrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:.88rem}
.insrow:last-child{border-bottom:none}
.insrow .t{flex:1;font-weight:600}
.insrow .dday{font-weight:800;font-size:.74rem}
.insrow .dday.soon{color:#b9760a}.insrow .dday.over{color:var(--err)}.insrow .dday.normal{color:var(--muted)}
@media(max-width:640px){.insgrid{grid-template-columns:1fr}}
.wl{padding:12px 0;border-bottom:1px solid var(--line)}
.wl:last-child{border-bottom:none}
.wl-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:7px}
.wl-name{font-weight:700;font-size:.95rem}
.wl-tag{font-size:.68rem;font-weight:800;border-radius:20px;padding:2px 8px;margin-left:4px}
.wl-nums{font-size:.82rem;color:var(--muted)}
.wl-nums b{color:var(--ink)}
.wl-bar{height:9px;background:#eceff3;border-radius:9px;overflow:hidden}
.wl-bar>i{display:block;height:100%;border-radius:9px;transition:width .3s}
.wl-sub{font-size:.76rem;color:var(--muted);margin-top:5px}
.side-foot .btn-s.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.staff-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.staffwrap{display:grid;grid-template-columns:322px 1fr;gap:16px;align-items:start}
.staff-list{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px;max-height:72vh;overflow:auto}
.stcard{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:none;background:transparent;padding:10px 11px;border-radius:12px;cursor:pointer;margin-bottom:2px}
.stcard:hover{background:#f4f6fa}.stcard.on{background:var(--soft)}
.stcard-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.stcard-n{font-weight:700;font-size:.9rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.avatar{flex:0 0 auto;width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1rem}
.avatar.lg{width:56px;height:56px;font-size:1.5rem}
.rk{font-size:.68rem;font-weight:800;border-radius:20px;padding:2px 9px;white-space:nowrap}
.sdot{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:700}
.sdot i{width:8px;height:8px;border-radius:50%;display:inline-block}
.staff-detail{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;min-width:0}
.sd-top{display:flex;align-items:center;gap:14px;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:18px}
.sd-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sd-fld label{display:block;font-size:.74rem;font-weight:700;color:var(--navy);margin-bottom:5px;letter-spacing:.3px}
.sd-fld input,.sd-fld select{width:100%;font-size:.92rem;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fcfcfa}
.sd-fld input:focus,.sd-fld select:focus{outline:none;border-color:var(--navy);background:#fff}
.sd-actions{display:flex;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.sd-work{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.sd-worktitle{font-size:.78rem;font-weight:700;color:var(--navy);margin-bottom:6px;letter-spacing:.3px}
.workrow{display:flex;align-items:center;gap:9px;padding:9px 8px;border-radius:9px;cursor:pointer;font-size:.88rem}
.workrow:hover{background:#f4f6fa}
.workrow .t{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.workrow .badge,.workrow .rk{flex:0 0 auto}
.workrow .dday{flex:0 0 auto;font-weight:800;font-size:.74rem}
/* --- 조직도 (드래그로 부서 이동) --- */
.orgpage{padding:8px 2px 4px}
.oboss{display:flex;justify-content:center;gap:12px}
.oboss .opers{min-width:190px;border-color:#cdddf3;background:linear-gradient(#fff,#f3f7fd)}
.ostem{width:2px;height:22px;background:var(--line);margin:2px auto}
.oboard{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;align-items:start}
.ocol{background:#fafbfc;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-height:130px}
.ocol-h{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.ocol-t{font-weight:800;font-size:.9rem;color:var(--ink)}
.ocol-c{font-size:.72rem;color:var(--muted);font-weight:700}
.ocol-body{padding:8px;display:flex;flex-direction:column;gap:8px;flex:1;transition:background .12s}
.ocol-body.over,.obench-body.over{background:#eaf1fb;outline:2px dashed var(--navy);outline-offset:-4px}
.opers{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:8px 10px;cursor:pointer;box-shadow:0 6px 14px -13px rgba(0,0,0,.5)}
.opers.drg{cursor:grab}.opers.drg:active{cursor:grabbing}
.opers.dragging{opacity:.4}
.opers.odir{background:linear-gradient(#fff,#f5f8fd);border-color:#cdddf3}
.opers-b{min-width:0;flex:1}
.opers-n{font-weight:700;font-size:.86rem;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opers-role{font-size:.64rem;font-weight:700;color:var(--muted);background:var(--soft);padding:1px 6px;border-radius:5px;flex:0 0 auto}
.opers-days{font-size:.72rem;color:var(--navy);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opers-days b{font-weight:800}
.odir-empty,.odrop-hint{font-size:.74rem;color:var(--muted);text-align:center;padding:10px 4px;border:1px dashed var(--line);border-radius:9px}
.obench{margin-top:16px;background:#fafbfc;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.obench-h{font-weight:800;font-size:.82rem;margin-bottom:8px}
.obench-body{display:flex;flex-wrap:wrap;gap:8px;min-height:46px;border-radius:9px;padding:2px;transition:background .12s}
.obench-body .opers{flex:0 0 auto;min-width:184px}
.deptexp{display:flex;flex-wrap:wrap;gap:6px;padding-top:6px}
.dexp{font-size:.74rem;font-weight:600;border:1px solid #ccc;border-radius:7px;padding:3px 8px;background:#fff}.dexp b{font-weight:800}
/* 거버넌스(이사회/감사/자문) */
.ogov{display:flex;gap:16px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.ogov-main{display:flex;flex-direction:column;align-items:center}
.ogov-label{font-size:.7rem;font-weight:800;color:var(--muted);letter-spacing:.5px;margin-bottom:7px;text-transform:uppercase}
.ogov-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.ogov-aside{border:1.5px dashed #c9d3e0;border-radius:12px;padding:8px 12px;background:#fbfbf9}
.gcard{background:linear-gradient(#fff,#f2f6fd);border:1px solid #cdddf3;border-radius:12px;padding:8px 16px;text-align:center;min-width:122px;box-shadow:0 8px 18px -16px rgba(0,0,0,.5)}
.ogov-aside .gcard{background:#fff;border-style:dashed}
.gcard-n{font-weight:800;font-size:.9rem}
.gcard-t{font-size:.73rem;color:var(--navy);font-weight:600;margin-top:1px}
.goved{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
.goved-h{font-weight:800;font-size:.84rem;margin-bottom:10px}
.goved-row{display:grid;grid-template-columns:1.1fr 1.3fr 1fr 1.15fr 34px;gap:8px;margin-bottom:8px;align-items:center}
.goved-row input,.goved-row select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:.82rem;background:#fcfcfa;min-width:0;box-sizing:border-box}
.gm-del{border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;color:#c0392b;font-weight:700;padding:6px 0}
.gm-del:hover{background:#fdeeea}
.gm-add{margin-top:4px}
@media(max-width:900px){.oboard{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.goved-row{grid-template-columns:1fr 1fr}.goved-row .gm-del{grid-column:span 2}}
@media(max-width:560px){.oboard{grid-template-columns:1fr}}
.today-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:16px;border-left:4px solid var(--navy)}
.today-card.warn{border-left-color:var(--err)}
.today-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:.88rem}
.today-row:last-child{border-bottom:none}
.today-row .t{flex:1;font-weight:600}
.todo-top{font-size:1.02rem;margin-bottom:14px}.todo-top b{color:var(--ink)}
.todo{display:flex;flex-direction:column;gap:14px}
.todo-sec{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px 8px 8px}
.todo-h{display:flex;align-items:center;gap:8px;font-size:.86rem;font-weight:800;color:var(--ink2);padding:11px 8px 8px}
.todo-h span{margin-left:auto;background:#eef1f6;border-radius:20px;padding:1px 10px;font-size:.74rem;color:var(--muted)}
.todo-h.over{color:var(--err)}.todo-h.soon{color:#b9760a}.todo-h.muted{color:var(--muted)}
.todo-item{display:flex;align-items:center;gap:10px;padding:11px 9px;border-radius:10px;cursor:pointer;border-top:1px solid var(--line)}
.todo-item:hover{background:#f4f6fa}
.ti-t{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ti-badge{flex:0 0 auto;font-size:.68rem;font-weight:800;border-radius:20px;padding:2px 9px;white-space:nowrap}
.todo-item .dday{flex:0 0 auto;font-weight:800;font-size:.74rem;white-space:nowrap}.todo-item .badge{flex:0 0 auto}
@media(max-width:760px){.staffwrap{grid-template-columns:1fr}.staff-list{max-height:none}}
.rpt-nav{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.rpt-title{font-family:'Fraunces',serif;font-size:1.25rem;font-weight:600;color:var(--navy);min-width:130px;text-align:center}
/* 알림 벨 */
.bellwrap{position:relative;display:inline-block}
.bell{position:relative}
#bellCount{display:none;position:absolute;top:-6px;right:-6px;min-width:17px;height:17px;padding:0 4px;background:var(--err);color:#fff;border-radius:20px;font-size:.64rem;font-weight:800;align-items:center;justify-content:center;line-height:1}
.bellpanel{display:none;position:absolute;right:0;top:calc(100% + 8px);width:300px;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 50px -24px rgba(0,0,0,.5);z-index:80;padding:6px}
.nitem{display:flex;gap:9px;align-items:flex-start;padding:10px;border-radius:10px;cursor:pointer}
.nitem:hover{background:#f4f6fa}
.nmain{flex:1;min-width:0}
.nt{font-weight:700;font-size:.9rem}
.nsub{font-size:.76rem;color:var(--muted)}
.ntag{flex:0 0 auto;font-size:.66rem;font-weight:800;border-radius:20px;padding:2px 7px;margin-top:2px}
.ntag.over{background:#fdecec;color:var(--err)}.ntag.soon{background:#fff2dd;color:#b9760a}.ntag.new{background:#e7f0fb;color:#2266b8}
.nempty{padding:22px 10px;text-align:center;color:var(--muted);font-size:.88rem}
@media(max-width:640px){.bellpanel{width:min(300px,86vw)}}
.col{min-width:0;background:#eef0ea;border-radius:14px;padding:8px;min-height:140px}
@media(max-width:900px){.col{flex:0 0 210px}}
.col.drag{outline:2px dashed var(--navy);outline-offset:-4px}
.col h3{font-size:.82rem;font-weight:700;display:flex;justify-content:space-between;align-items:center;padding:4px 6px 10px;color:var(--ink2)}
.col h3 .c{background:#fff;border-radius:20px;padding:1px 9px;font-size:.74rem;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 13px;margin-bottom:9px;cursor:grab;box-shadow:0 6px 14px -12px rgba(0,0,0,.4)}
.card:active{cursor:grabbing}
.card .ct{font-weight:700;font-size:.9rem;margin-bottom:5px;overflow-wrap:anywhere;word-break:keep-all}
.card .cm{font-size:.76rem;color:var(--muted);display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.card .who{background:var(--soft);color:var(--navy);border-radius:20px;padding:1px 8px;font-weight:600}
.card .due{color:#b9760a;font-weight:600}.card .due.over{color:var(--err)}
/* imflow 스타일 작업진행 카드 */
.card .ctype{background:#eef2f9;color:var(--navy);border-radius:20px;padding:1px 8px;font-weight:700;font-size:.7rem}
.card .dday{margin-left:auto;font-weight:800;font-size:.72rem}
.card .dday.soon{color:#b9760a}.card .dday.over{color:var(--err)}.card .dday.normal{color:var(--muted)}
.cbar-lab{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);margin:9px 0 4px}
.cbar{height:6px;background:#e7ebf1;border-radius:6px;overflow:hidden}
.cbar>i{display:block;height:100%;background:var(--navy);border-radius:6px;transition:width .3s}
.updue-h{font-size:.82rem;font-weight:700;color:var(--ink);margin:2px 0 9px;display:flex;align-items:center;gap:6px}
.updue{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.updue .u{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 13px;font-size:.84rem;font-weight:600;cursor:pointer;transition:.15s}
.updue .u:hover{border-color:var(--navy)}
.updue .u .dday{font-weight:800;font-size:.74rem}
.updue .u .dday.soon{color:#b9760a}.updue .u .dday.over{color:var(--err)}.updue .u .dday.normal{color:var(--muted)}
.modal{display:none;position:fixed;inset:0;z-index:90;background:rgba(20,30,25,.5);backdrop-filter:blur(3px);padding:24px;overflow-y:auto}
.modal.show{display:flex;align-items:flex-start;justify-content:center}
.sheet{background:var(--panel);border-radius:20px;max-width:720px;width:100%;margin:auto;box-shadow:0 50px 90px -40px rgba(0,0,0,.5)}
.sheet .mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:24px 28px 16px;border-bottom:1px solid var(--line)}
.sheet h2{font-size:1.4rem;font-weight:600}
.sheet .sub{color:var(--muted);font-size:.84rem;margin-top:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.x{background:none;border:none;font-size:1.5rem;color:var(--muted);line-height:1;padding:4px}
.mbody{padding:20px 28px 26px}
.statusbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px}
.statusbar button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 13px;font-size:.8rem;font-weight:600;color:var(--ink2)}
.statusbar button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.fld label{display:block;font-size:.76rem;font-weight:700;color:var(--navy);margin-bottom:5px;letter-spacing:.3px}
.fld input,.fld select,.fld textarea{width:100%;font-size:.94rem;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fcfcfa}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--navy);background:#fff}
.fld textarea{resize:vertical;min-height:70px}
.assignwrap{display:flex;gap:8px}.assignwrap select{flex:1}
.saved{font-size:.74rem;color:#1e8a4c;font-weight:600;opacity:0;transition:.3s}.saved.show{opacity:1}
.checklist .cl-item{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.checklist .cl-item input[type=checkbox]{width:17px;height:17px;accent-color:var(--navy)}
.checklist .cl-item .t{flex:1;font-size:.92rem}
.checklist .cl-item.done .t{text-decoration:line-through;color:var(--muted)}
.checklist .cl-item .rm{background:none;border:none;color:var(--muted);font-size:1rem}
.cl-add{display:flex;gap:8px;margin-top:10px}
.cl-add input{flex:1;padding:8px 11px;border:1px solid var(--line);border-radius:9px;font-size:.9rem}
.cl-bar{height:6px;background:#eceff3;border-radius:6px;overflow:hidden;margin:6px 0 12px}
.cl-bar > i{display:block;height:100%;background:var(--navy)}
/* imflow 단계형 작업 보드 */
.tasklist{margin-top:6px;margin-bottom:8px}
.trow{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px 8px;margin-bottom:6px}
.trow .tt{flex:1;min-width:0;font-size:.9rem;line-height:1.3;overflow-wrap:anywhere}
.trow.done .tt{text-decoration:line-through;color:var(--muted)}
.trow .tstage{flex:0 0 auto;width:80px;font-size:.76rem;padding:5px 4px;border:1px solid var(--line);border-radius:6px;background:#fbfcfe;color:var(--ink2);font-weight:600}
.trow .ta{flex:0 0 auto;width:104px;font-size:.76rem;padding:5px 4px;border:1px solid var(--line);border-radius:6px;background:#fbfcfe;color:var(--ink2)}
.trow .tdue{flex:0 0 auto;width:120px;font-size:.72rem;padding:4px;border:1px solid var(--line);border-radius:6px;background:#fbfcfe;color:var(--ink2)}
.trow .rm{background:none;border:none;color:#b6bfcf;cursor:pointer;font-size:1rem;padding:1px 5px;border-radius:6px;line-height:1}
.trow .rm:hover{background:#fdecec;color:var(--err)}
.tadd{display:flex;gap:6px;margin-top:2px}
.tadd input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:.86rem;background:#fff}
.tadd input:focus{outline:none;border-color:var(--navy)}
.tadd button{flex:0 0 auto;padding:0 14px;border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--navy);font-weight:700;font-size:.82rem;cursor:pointer}
.tadd button:hover{border-color:var(--navy);background:var(--soft)}
.comments{margin-top:20px}
.cmlist{margin:8px 0 10px;max-height:230px;overflow:auto}
.cmitem{padding:8px 0;border-bottom:1px dashed var(--line)}
.cmitem:last-child{border-bottom:none}
.cmhead{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);margin-bottom:2px}
.cmhead b{color:var(--ink2);font-weight:700}
.cmtext{font-size:.9rem;white-space:pre-wrap;line-height:1.4}
.cmitem.sys .cmtext{color:var(--muted);font-size:.82rem;font-style:italic}
@media(max-width:560px){.trow{flex-wrap:wrap}.trow .tt{flex:1 0 100%}.trow .tstage,.trow .ta,.trow .tdue{flex:1}}
.detail-data{margin-top:8px;border-top:1px solid var(--line);padding-top:16px}
.dgrp{margin-bottom:16px}
.dgrp .gk{font-weight:700;font-size:.7rem;letter-spacing:1.2px;text-transform:uppercase;color:var(--navy);margin-bottom:8px}
.drow{display:flex;gap:12px;padding:6px 0;font-size:.92rem;border-bottom:1px dashed var(--line)}
.drow:last-child{border-bottom:none}
.drow .k{flex:0 0 120px;color:var(--muted);font-weight:600}
.drow .v{flex:1;white-space:pre-wrap}.drow .v a{color:var(--navy);font-weight:600}
.mfoot{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.copy{background:var(--navy);color:#fff;border:none;border-radius:10px;padding:11px 18px;font-weight:700;font-size:.9rem}.copy.ok{background:#1e8a4c}
.qbtn{background:#1f3f73;color:#fff;border:none;border-radius:10px;padding:11px 18px;font-weight:700;font-size:.9rem}.qbtn:hover{background:#15294d}
.del{background:none;border:1px solid #e3c4c0;color:var(--err);border-radius:10px;padding:10px 16px;font-weight:600;font-size:.86rem}.del:hover{background:#fdf0ef}
@media(max-width:720px){.frow{grid-template-columns:1fr}.lrow{grid-template-columns:26px 1fr 80px;font-size:.85rem}.lrow .hide-m{display:none}}
</style>
</head>

<script>
const SUPABASE_URL = "https://lnrugwschlcesaaertgc.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxucnVnd3NjaGxjZXNhYWVydGdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0ODczNzgsImV4cCI6MjA5NjA2MzM3OH0.JTpEUF2TO2NcuS1ak04hqd2IYfZ2bYn40L3EaLIwVGw";
// 통합 Supabase 프로젝트 내에서 aim 전용 스키마를 사용해 다른 사이트와 데이터를 분리합니다.
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { db: { schema: 'aim' } });

const PIPELINES={
  '홈페이지':['접수·견적','디자인','개발','검수','완료'],
  '어플':['접수·견적','기획','디자인','개발','테스트','완료'],
  '프로그램':['접수·견적','기획','개발','테스트','완료'],
  '홍보물':['접수·견적','시안','수정','인쇄·납품','완료']
};
const BOARD_TYPES=['전체','홈페이지','어플','프로그램','홍보물'];
const MACRO_ACTIVE=['접수·견적','진행중','검수'];
const STATUSES=[...new Set(Object.values(PIPELINES).flat())]; // 전체 단계 집합 (CSS/기타용)
function pipelineOf(r){return PIPELINES[r&&r.request_type]||PIPELINES['홈페이지'];}
function activeStages(type){const pl=PIPELINES[type]||PIPELINES['홈페이지'];return pl.slice(0,-1);}
function macroStatus(r){const s=r.status||'접수·견적';if(s==='접수·견적')return '접수·견적';if(s==='완료')return '완료';const pl=pipelineOf(r);return s===pl[pl.length-2]?'검수':'진행중';}
function dueOf(r){const sd=r.stage_due; if(sd&&sd[r.status])return sd[r.status]; return r.due_date||'';}
const TASK_STAGES=['해야함','하는중','검토','끝'];
const STAGE_COLOR={'해야함':'#94a3b8','하는중':'#1f3f73','검토':'#d99a2b','끝':'#1e8a4c'};
const STAGE_MAP={'준비':'해야함','진행':'하는중','검토':'검토','완료':'끝'};
function effStage(c){ if(c.d) return '끝'; const s=c.s||''; return TASK_STAGES.includes(s)?s:(STAGE_MAP[s]||'해야함'); }
const MODE_LABEL={keep:"기존 그대로",similar:"참고 제작",new:"새로 제작"};
let rows=[], assignees=[], selId=null, view='list', scope='all', showAllDone=false, boardType='전체';
const DONE_CAP=5;
function scopedRows(){ return (scope==='mine' && me && me.name) ? rows.filter(r=>r.assignee===me.name) : rows; }

const gate=document.getElementById('gate'), app=document.getElementById('app'), gerr=document.getElementById('gerr');
let me=null, authMode='login';
function openApp(){gate.style.display='none';app.classList.add('show');if(!nSeen())nMark();loadAll();}
function closeApp(){app.classList.remove('show');gate.style.display='flex';showAuth();}
function showAuth(){document.getElementById('authSection').style.display='';document.getElementById('pendSection').style.display='none';}
function showPending(msg){document.getElementById('authSection').style.display='none';document.getElementById('pendSection').style.display='';if(msg)document.getElementById('pendMsg').innerHTML=msg;}
function setMode(m){
  authMode=m; gerr.textContent='';
  const su=m==='signup';
  document.getElementById('nm').style.display=su?'block':'none';
  document.getElementById('gsub').textContent=su?'직원 회원가입':'직원 로그인';
  document.getElementById('enter').textContent=su?'회원가입 신청':'로그인';
  document.getElementById('switchMode').textContent=su?'이미 계정이 있으신가요? 로그인':'직원이신가요? 회원가입';
}
document.getElementById('switchMode').addEventListener('click',()=>setMode(authMode==='login'?'signup':'login'));

async function loadMe(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user){me=null;return;}
  const {data}=await sb.from('staff').select('*').eq('id',user.id).maybeSingle();
  me = data || {id:user.id,email:user.email,status:'pending',role:'staff'};
}
async function afterAuth(){
  await loadMe();
  if(me && me.status==='approved'){
    document.getElementById('staffBtn').style.display = me.role==='owner'?'inline-flex':'none';
    document.getElementById('tabTeam').style.display = me.role==='owner'?'block':'none';
    showAuth(); openApp();
  } else if(me && me.status==='rejected'){
    showPending('접근이 거부된 계정입니다.<br>관리자에게 문의해 주세요.');
  } else {
    showPending('승인 대기 중입니다.<br>관리자 승인 후 이용하실 수 있어요.');
  }
}
async function submitAuth(){
  gerr.textContent="";
  const email=document.getElementById('em').value.trim(), password=document.getElementById('pw').value;
  if(!email||!password){gerr.textContent="이메일과 비밀번호를 입력하세요.";return;}
  if(authMode==='signup'){
    const name=document.getElementById('nm').value.trim();
    if(!name){gerr.textContent="이름을 입력하세요.";return;}
    const {error}=await sb.auth.signUp({email,password,options:{data:{name}}});
    if(error){gerr.textContent="회원가입 실패: "+error.message;return;}
    showPending('가입 신청이 접수되었습니다.<br>관리자 승인 후 로그인하실 수 있어요.<br><span style="font-size:.8rem">(이메일 인증 안내가 오면 인증도 완료해 주세요.)</span>');
    return;
  }
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error){gerr.textContent="로그인 실패: 이메일 또는 비밀번호를 확인하세요.";return;}
  afterAuth();
}
async function logout(){await sb.auth.signOut();me=null;closeApp();}
document.getElementById('enter').addEventListener('click',submitAuth);
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')submitAuth();});
document.getElementById('em').addEventListener('keydown',e=>{if(e.key==='Enter')submitAuth();});
document.getElementById('nm').addEventListener('keydown',e=>{if(e.key==='Enter')submitAuth();});
document.getElementById('logoutTop').addEventListener('click',logout);
document.getElementById('pendLogout').addEventListener('click',logout);
document.getElementById('staffBtn').addEventListener('click',()=>setView('staff'));
(async()=>{const {data}=await sb.auth.getSession();if(data&&data.session)afterAuth();})();

// ---- 직원 관리 (owner 전용, 정식 화면) ----
const RANKS=['대표','개발 디렉터','디자인 디렉터','기획 디렉터','마케팅 디렉터','운영 디렉터','크루'];
const RANK_DESC={'대표':'대표 · CEO','개발 디렉터':'Development','디자인 디렉터':'Design','기획 디렉터':'Planning','마케팅 디렉터':'Marketing','운영 디렉터':'Operations','크루':'Crew'};
const RANK_COLOR={'대표':['#1f3f73','#fff'],'개발 디렉터':['#e0e9f7','#1f3f73'],'디자인 디렉터':['#efe9fb','#6a48c0'],'기획 디렉터':['#e7f0fb','#2266b8'],'마케팅 디렉터':['#fff2dd','#b9760a'],'운영 디렉터':['#e7f6ec','#1e8a4c'],'크루':['#eceff3','#5b6675']};
const DIRECTORS=['개발 디렉터','디자인 디렉터','기획 디렉터','마케팅 디렉터','운영 디렉터'];
let staffData=[], staffMode='list', staffSel=null, orgMembers=[];
function initials(n){n=(n||'').trim();return n?n[0].toUpperCase():'?';}
function rankBadge(r){r=r||'크루';const c=RANK_COLOR[r]||RANK_COLOR['크루'];return `<span class="rk" style="background:${c[0]};color:${c[1]}">${esc(r)}</span>`;}
function statusDot(s){const m={approved:['승인','#1e8a4c'],pending:['승인 대기','#b9760a'],rejected:['거부됨','#c0392b']};const x=m[s]||m.pending;return `<span class="sdot" style="color:${x[1]}"><i style="background:${x[1]}"></i>${x[0]}</span>`;}
async function loadStaff(){
  const el=document.getElementById('staffView');
  const {data,error}=await sb.from('staff').select('*').order('created_at',{ascending:true});
  if(error){el.innerHTML='<p class="dim" style="padding:20px">직원 목록 오류: '+esc(error.message)+'</p>';return;}
  staffData=data||[];
  if(staffSel && !staffData.find(s=>s.id===staffSel)) staffSel=null;
  if(!staffSel){const fp=staffData.find(s=>s.status==='pending')||staffData[0];staffSel=fp?fp.id:null;}
  const om=await sb.from('org_members').select('*').order('tier',{ascending:true}).order('sort',{ascending:true});
  orgMembers=om.error?[]:(om.data||[]);
  renderStaff();
}
function renderStaff(){
  const el=document.getElementById('staffView'); if(!el)return;
  const pend=staffData.filter(s=>s.status==='pending').length, appr=staffData.filter(s=>s.status==='approved').length;
  const head=`<div class="staff-head">
    <div><h2 style="margin:0">직원 관리</h2><div class="dim" style="font-size:.84rem">재직 ${appr}명 · 승인 대기 ${pend}명 · 전체 ${staffData.length}명</div></div>
    <div class="tabs"><button class="${staffMode==='list'?'on':''}" data-smode="list">직원 목록</button><button class="${staffMode==='org'?'on':''}" data-smode="org">조직도</button></div>
  </div>`;
  el.innerHTML=head+(staffMode==='org'?orgChart():staffMaster());
  el.querySelectorAll('[data-smode]').forEach(b=>b.addEventListener('click',()=>{staffMode=b.dataset.smode;renderStaff();}));
  el.querySelectorAll('[data-staff]').forEach(c=>c.addEventListener('click',()=>{staffSel=c.dataset.staff;renderStaff();}));
  el.querySelectorAll('[data-approve]').forEach(b=>b.addEventListener('click',()=>setStaff(b.dataset.approve,{status:'approved'})));
  el.querySelectorAll('[data-reject]').forEach(b=>b.addEventListener('click',()=>setStaff(b.dataset.reject,{status:'rejected'})));
  const rk=el.querySelector('#staffRank'); if(rk)rk.addEventListener('change',()=>setStaff(rk.dataset.id,{rank:rk.value}));
  const nm=el.querySelector('#staffName'); if(nm)nm.addEventListener('blur',()=>{const v=nm.value.trim();if(v&&v!==(staffData.find(x=>x.id===nm.dataset.id)||{}).name)setStaff(nm.dataset.id,{name:v});});
  const dp=el.querySelector('#staffDept'); if(dp)dp.addEventListener('change',()=>moveDept(dp.dataset.id,dp.value));
  el.querySelectorAll('.workrow[data-id]').forEach(w=>w.addEventListener('click',()=>openDetail(Number(w.dataset.id))));
  if(staffMode==='org')wireOrg(el);
}
function staffMaster(){
  const list=staffData.length?staffData.map(s=>`
    <button class="stcard ${s.id===staffSel?'on':''}" data-staff="${s.id}">
      <span class="avatar">${esc(initials(s.name))}</span>
      <span class="stcard-b"><span class="stcard-n">${esc(s.name||'(이름없음)')} ${rankBadge(s.rank)}</span><span class="dim" style="font-size:.75rem">${esc(s.email||'')}</span></span>
      <span class="stcard-s">${statusDot(s.status)}</span>
    </button>`).join(''):'<p class="dim" style="padding:16px">아직 가입한 직원이 없습니다.</p>';
  const sel=staffData.find(s=>s.id===staffSel);
  return `<div class="staffwrap"><div class="staff-list">${list}</div><div class="staff-detail">${sel?staffDetail(sel):'<div class="dim" style="padding:40px;text-align:center">왼쪽에서 직원을 선택하세요.</div>'}</div></div>`;
}
function staffDetail(s){
  const myProjects=rows.filter(r=>r.assignee===s.name && (r.status||'')!=='완료');
  const myTasks=[]; rows.forEach(r=>{(Array.isArray(r.checklist)?r.checklist:[]).forEach(t=>{if((t.a||'')===s.name && effStage(t)!=='끝') myTasks.push({r,t});});});
  const active=myProjects.length;
  const owner=s.role==='owner';
  const projList=myProjects.length?myProjects.map(r=>{const dd=ddayInfo(dueOf(r));return `<div class="workrow" data-id="${r.id}"><span class="badge st-${esc(r.status||'접수·견적')}">${esc(r.status||'접수·견적')}</span><span class="t">${esc(r.org_name)||'(이름없음)'} <span class="dim" style="font-weight:400;font-size:.76rem">· ${esc(r.request_type||'')}</span></span>${dd?`<span class="dday ${dd.tone}">${dd.label}</span>`:''}</div>`;}).join(''):'<div class="dim" style="padding:8px 2px">담당 프로젝트가 없어요.</div>';
  const taskList=myTasks.length?myTasks.map(({r,t})=>{const es=effStage(t),c=STAGE_COLOR[es]||['#eee','#555'];const dd=t.due?ddayInfo(t.due):null;return `<div class="workrow" data-id="${r.id}"><span class="rk" style="background:${c[0]};color:${c[1]}">${es}</span><span class="t">${esc(t.t)} <span class="dim" style="font-weight:400;font-size:.76rem">· ${esc(r.org_name)||''}</span></span>${t.due?`<span class="dday ${dd?dd.tone:''}">${t.due}</span>`:''}</div>`;}).join(''):'<div class="dim" style="padding:8px 2px">배정된 할일이 없어요.</div>';
  return `<div class="sd-top">
    <span class="avatar lg">${esc(initials(s.name))}</span>
    <div style="min-width:0"><h3 style="margin:0">${esc(s.name||'(이름없음)')}</h3><div class="dim">${esc(s.email||'')}</div></div>
    ${owner?'<span class="badge st-확정" style="margin-left:auto">관리자</span>':''}
  </div>
  <div class="sd-grid">
    <div class="sd-fld"><label>이름</label><input id="staffName" data-id="${s.id}" value="${esc(s.name||'')}"></div>
    <div class="sd-fld"><label>직급</label>${owner?`<div style="padding-top:6px">${rankBadge(s.rank)} <span class="dim" style="font-size:.76rem">(대표 고정)</span></div>`:`<select id="staffRank" data-id="${s.id}">${RANKS.map(r=>`<option ${((s.rank||'크루')===r)?'selected':''}>${r}</option>`).join('')}</select>`}</div>
    <div class="sd-fld"><label>상태</label><div style="padding-top:6px">${statusDot(s.status)}</div></div>
    ${owner?`<div class="sd-fld"><label>진행중 업무</label><div style="padding-top:6px"><b style="font-size:1.1rem;color:var(--navy)">${active}</b> 건</div></div>`
      :`<div class="sd-fld"><label>소속 부서 ${s.dept_since?`<span class="dim" style="font-weight:400">· 이 부서 ${daysSince(s.dept_since)}일차</span>`:''}</label><select id="staffDept" data-id="${s.id}"><option value="">미배정</option>${DEPTS.map(d=>`<option ${((s.department||'')===d)?'selected':''}>${d}</option>`).join('')}</select></div>`}
  </div>
  ${owner?'':`<div class="sd-fld" style="margin-top:12px"><label>부서 경험 (누적 재직일)</label><div class="deptexp">${(()=>{const t=deptTotals(s);const ks=Object.keys(t).filter(k=>t[k]>0);return ks.length?ks.map(k=>`<span class="dexp" style="border-color:${DEPT_COLOR[k]||'#ccc'};color:${DEPT_COLOR[k]||'#555'}">${k} <b>${t[k]}일</b></span>`).join(''):'<span class="dim">아직 부서 배치 기록이 없어요.</span>';})()}</div></div>`}
  <div class="sd-work">
    <div class="sd-worktitle">담당 프로젝트 <span class="dim">${myProjects.length}</span></div>
    ${projList}
    <div class="sd-worktitle" style="margin-top:16px">배정된 할일 <span class="dim">${myTasks.length}</span></div>
    ${taskList}
  </div>
  ${owner?'':`<div class="sd-actions">
    ${s.status!=='approved'?`<button class="btn-p" data-approve="${s.id}">승인</button>`:''}
    ${s.status==='approved'?`<button class="btn-s" data-reject="${s.id}">접근 정지</button>`:''}
    ${s.status==='rejected'?`<button class="btn-s" data-approve="${s.id}">복구(승인)</button>`:''}
  </div>`}`;
}
// 부서(department)와 담당 디렉터/색 매핑
const DEPTS=['개발','디자인','기획','마케팅','운영'];
const DEPT_DIRECTOR={'개발':'개발 디렉터','디자인':'디자인 디렉터','기획':'기획 디렉터','마케팅':'마케팅 디렉터','운영':'운영 디렉터'};
const DEPT_COLOR={'개발':'#1f3f73','디자인':'#6a48c0','기획':'#2266b8','마케팅':'#b9760a','운영':'#1e8a4c'};
function daysSince(dstr){if(!dstr)return null;const a=new Date(dstr+'T00:00:00');const b=new Date();b.setHours(0,0,0,0);return Math.max(0,Math.round((b-a)/86400000));}
// 부서별 누적 재직일수 (이력 + 현재)
function deptTotals(s){
  const t={};
  (Array.isArray(s.dept_history)?s.dept_history:[]).forEach(h=>{
    if(!h||!h.dept||!h.from)return;
    const from=new Date(h.from+'T00:00:00');
    const to=new Date((h.to||todayStr())+'T00:00:00');
    t[h.dept]=(t[h.dept]||0)+Math.max(0,Math.round((to-from)/86400000));
  });
  if(s.department&&s.dept_since){t[s.department]=(t[s.department]||0)+(daysSince(s.dept_since)||0);}
  return t;
}
function orgPersonCard(s,draggable,isDir){
  const days=daysSince(s.dept_since);
  const totals=deptTotals(s);
  const brk=Object.entries(totals).filter(([,v])=>v>0).map(([k,v])=>`${k} ${v}일`).join(' · ');
  const role=isDir?'디렉터':((s.rank||'크루')==='크루'?'크루':esc(s.rank||''));
  const daysLine=days!=null
    ? `<div class="opers-days">이 부서 <b>${days}일</b>${brk?` · <span class="dim">누적 ${brk}</span>`:''}</div>`
    : (brk?`<div class="opers-days dim">누적 ${brk}</div>`:'');
  return `<div class="opers${isDir?' odir':''}${draggable?' drg':''}" ${draggable?'draggable="true" ':''}data-sid="${s.id}">
    <span class="avatar">${esc(initials(s.name))}</span>
    <div class="opers-b">
      <div class="opers-n">${esc(s.name||'(이름없음)')}<span class="opers-role">${role}</span></div>
      ${daysLine}
    </div>
  </div>`;
}
function govCard(m){return `<div class="gcard"><div class="gcard-n">${esc(m.name||'')}</div><div class="gcard-t">${esc(m.title||'')}${m.scope?` · ${esc(m.scope)}`:''}</div></div>`;}
function orgChart(){
  const appr=staffData.filter(s=>s.status==='approved');
  const boss=appr.filter(s=>(s.rank||'')==='대표');
  const isDir=s=>DIRECTORS.includes(s.rank||'');
  const crew=appr.filter(s=>!isDir(s)&&(s.rank||'')!=='대표');   // 팀원(크루)
  const unassigned=crew.filter(s=>!s.department);
  const board=orgMembers.filter(m=>m.tier!=='advisory');
  const advisory=orgMembers.filter(m=>m.tier==='advisory');
  const cols=DEPTS.map(d=>{
    const dir=appr.find(s=>s.rank===DEPT_DIRECTOR[d]);
    const mem=crew.filter(s=>s.department===d);
    return `<div class="ocol">
      <div class="ocol-h" style="box-shadow:inset 0 3px 0 ${DEPT_COLOR[d]}"><span class="ocol-t">${d}</span><span class="ocol-c">${(dir?1:0)+mem.length}명</span></div>
      <div class="ocol-body" data-drop data-dept="${d}">
        ${dir?orgPersonCard(dir,false,true):'<div class="odir-empty">디렉터 미지정</div>'}
        ${mem.length?mem.map(s=>orgPersonCard(s,true,false)).join(''):'<div class="odrop-hint">여기로 크루를 끌어다 놓으세요</div>'}
      </div>
    </div>`;
  }).join('');
  const gov=(board.length||advisory.length)?`
    <div class="ogov">
      <div class="ogov-main">
        <div class="ogov-label">이사회 · 대표단</div>
        <div class="ogov-row">${board.length?board.map(govCard).join(''):'<div class="dim">등록된 대표단이 없어요.</div>'}</div>
      </div>
      ${advisory.length?`<div class="ogov-aside"><div class="ogov-label">감사 · 자문</div><div class="ogov-row">${advisory.map(govCard).join('')}</div></div>`:''}
    </div>
    <div class="ostem"></div>`:'';
  const editor=`
    <div class="goved">
      <div class="goved-h">대표단 · 감사 · 자문 편집 <span class="dim" style="font-weight:400">· 로그인 없이 이름으로 관리</span></div>
      <div class="goved-list">
        ${orgMembers.map(m=>`<div class="goved-row" data-gid="${m.id}">
          <input class="gm-f" data-k="name" value="${esc(m.name||'')}" placeholder="이름">
          <input class="gm-f" data-k="title" value="${esc(m.title||'')}" placeholder="직책 (이사장/감사/고문…)">
          <input class="gm-f" data-k="scope" value="${esc(m.scope||'')}" placeholder="본부/부가 (선택)">
          <select class="gm-f" data-k="tier"><option value="board" ${m.tier!=='advisory'?'selected':''}>이사회·대표단</option><option value="advisory" ${m.tier==='advisory'?'selected':''}>감사·자문</option></select>
          <button class="gm-del" title="삭제">✕</button>
        </div>`).join('')||'<div class="dim" style="padding:6px 2px">아직 등록된 인원이 없어요. 아래 버튼으로 추가하세요.</div>'}
      </div>
      <button class="gm-add btn-s">＋ 인원 추가 (이사·감사·고문)</button>
    </div>`;
  return `<div class="orgpage">
    ${gov}
    <div class="oboss">${boss.length?boss.map(s=>orgPersonCard(s,false,false)).join(''):'<div class="dim">대표(CEO) 미지정 · 직원 목록에서 직급을 대표로 지정</div>'}</div>
    <div class="ostem"></div>
    <div class="oboard">${cols}</div>
    <div class="obench">
      <div class="obench-h">미배정 크루 <span class="dim">${unassigned.length}명</span> <span class="dim" style="font-weight:400">· 부서로 드래그해서 배치</span></div>
      <div class="obench-body" data-drop data-dept="">${unassigned.length?unassigned.map(s=>orgPersonCard(s,true,false)).join(''):'<div class="dim" style="padding:8px">미배정 크루가 없어요.</div>'}</div>
    </div>
    <p class="dim" style="margin-top:14px;font-size:.8rem"><b>크루 카드를 다른 부서로 드래그</b>하면 소속이 바뀌고, 그 부서에서의 재직 시작일이 오늘로 기록돼요. 카드를 클릭하면 상세로 이동합니다. (모바일은 상세의 <b>소속 부서</b>에서 변경)</p>
    ${editor}
  </div>`;
}
function wireOrg(el){
  let dragId=null;
  el.querySelectorAll('.opers.drg').forEach(c=>{
    c.addEventListener('dragstart',e=>{dragId=c.dataset.sid;e.dataTransfer.setData('text/plain',c.dataset.sid);e.dataTransfer.effectAllowed='move';c.classList.add('dragging');});
    c.addEventListener('dragend',()=>c.classList.remove('dragging'));
  });
  el.querySelectorAll('[data-drop]').forEach(z=>{
    z.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';z.classList.add('over');});
    z.addEventListener('dragleave',()=>z.classList.remove('over'));
    z.addEventListener('drop',e=>{e.preventDefault();z.classList.remove('over');const id=e.dataTransfer.getData('text/plain')||dragId;if(id)moveDept(id,z.dataset.dept||'');});
  });
  el.querySelectorAll('.opers[data-sid]').forEach(c=>c.addEventListener('click',()=>{if(c.classList.contains('dragging'))return;staffSel=c.dataset.sid;staffMode='list';renderStaff();}));
  // 거버넌스 편집기
  const add=el.querySelector('.gm-add'); if(add)add.addEventListener('click',addOrgMember);
  el.querySelectorAll('.goved-row').forEach(row=>{
    const id=row.dataset.gid;
    row.querySelectorAll('.gm-f').forEach(f=>{
      const ev=f.tagName==='SELECT'?'change':'change';
      f.addEventListener(ev,()=>updateOrgMember(id,{[f.dataset.k]:f.value.trim?f.value.trim():f.value}));
    });
    const del=row.querySelector('.gm-del'); if(del)del.addEventListener('click',()=>delOrgMember(id));
  });
}
async function addOrgMember(){
  const maxSort=orgMembers.reduce((a,m)=>Math.max(a,m.sort||0),0);
  const {error}=await sb.from('org_members').insert({name:'새 인원',title:'',tier:'board',sort:maxSort+1});
  if(error){alert('추가 실패: '+error.message+'\\n(org_members 테이블이 없으면 14_org_members.sql 을 실행하세요)');return;}
  loadStaff();
}
async function updateOrgMember(id,patch){
  const {error}=await sb.from('org_members').update(patch).eq('id',id);
  if(error){alert('수정 실패: '+error.message);return;}
  const m=orgMembers.find(x=>String(x.id)===String(id)); if(m)Object.assign(m,patch);
  renderStaff();
}
async function delOrgMember(id){
  const m=orgMembers.find(x=>String(x.id)===String(id));
  if(!confirm(`'${m?m.name:'이 인원'}'을(를) 조직도에서 삭제할까요?`))return;
  const {error}=await sb.from('org_members').delete().eq('id',id);
  if(error){alert('삭제 실패: '+error.message);return;}
  loadStaff();
}
// 부서 이동: 현재 부서를 이력에 마감 기록하고 새 부서로 (재직 시작일=오늘)
async function moveDept(id,dept){
  const s=staffData.find(x=>x.id===id); if(!s)return;
  const cur=s.department||null, nd=dept||null;
  if(cur===nd)return;
  const today=todayStr();
  const hist=Array.isArray(s.dept_history)?[...s.dept_history]:[];
  if(cur)hist.push({dept:cur,from:s.dept_since||today,to:today});
  await setStaff(id,{department:nd,dept_since:nd?today:null,dept_history:hist});
}
async function setStaff(id,patch){
  const s0=staffData.find(x=>x.id===id);
  const oldName=s0?s0.name:null;
  const {error}=await sb.from('staff').update(patch).eq('id',id);
  if(error){alert('변경 실패: '+error.message+(patch.rank!==undefined?'\\n(rank 컬럼이 없으면 11_staff_rank.sql 을 실행하세요)':'')+(patch.department!==undefined?'\\n(department 컬럼이 없으면 12_department.sql 을 실행하세요)':''));return;}
  if(s0)Object.assign(s0,patch);
  staffSel=id; renderStaff();
  // 이름을 바꾸면 기존 프로젝트 담당자·할일 담당까지 자동 반영
  if(patch.name!==undefined && oldName && patch.name && patch.name!==oldName){
    await renameAssignee(oldName,patch.name);
  }
  if(patch.status!==undefined) loadAll();
}
// 직원 이름 변경 시, 모든 프로젝트의 담당자(assignee) + 할일 담당(checklist.a)을 새 이름으로 일괄 변경
async function renameAssignee(oldName,newName){
  if(!oldName||oldName===newName)return;
  let n=0;
  // 1) 프로젝트 담당자
  const up=await sb.from('requests').update({assignee:newName}).eq('assignee',oldName).select('id');
  if(up.error){alert('담당자 이름 반영 실패: '+up.error.message);}
  else n+=(up.data||[]).length;
  // 2) 할일(체크리스트) 담당자 — jsonb라 해당 행만 개별 갱신
  const affected=rows.filter(r=>Array.isArray(r.checklist)&&r.checklist.some(t=>(t&&t.a||'')===oldName));
  for(const r of affected){
    const cl=r.checklist.map(t=>((t&&t.a||'')===oldName?Object.assign({},t,{a:newName}):t));
    const u2=await sb.from('requests').update({checklist:cl}).eq('id',r.id);
    if(!u2.error){r.checklist=cl;}
  }
  await loadAll();
  if(n||affected.length){/* 조용히 반영 */}
}

async function loadAll(){
  const [r,a]=await Promise.all([
    sb.from('requests').select('*').order('created_at',{ascending:true}),
    sb.from('staff').select('name,status').eq('status','approved').order('name')
  ]);
  if(r.error){alert('불러오기 실패: '+r.error.message);return;}
  rows=r.data||[]; assignees=(a.data||[]).map(x=>x.name).filter(Boolean);
  renderSummary(); render();
  if(selId){const x=rows.find(v=>v.id===selId); if(x) openDetail(x.id);}
}

function inThisWeek(d){if(!d)return false;const due=new Date(d+'T00:00:00');const now=new Date();const end=new Date();end.setDate(now.getDate()+7);return due>=new Date(now.toDateString())&&due<=end;}

function nSeen(){ try{return localStorage.getItem('tcs_notif_seen')||''}catch(e){return ''} }
function nMark(){ try{localStorage.setItem('tcs_notif_seen', new Date().toISOString())}catch(e){} }
function computeNotifs(){
  const seen=nSeen(); const out=[]; const done=new Set();
  const mine=r=> me && me.name && r.assignee===me.name;
  rows.forEach(r=>{
    if((r.status||'')==='완료') return;
    const dd=ddayInfo(dueOf(r));
    if(mine(r) && dd && (dd.tone==='over'||dd.tone==='soon')){ out.push({r,kind:dd.tone,dd}); done.add(r.id); }
  });
  rows.forEach(r=>{
    if(done.has(r.id)) return;
    if(!(seen && r.created_at && r.created_at>seen)) return;
    if(mine(r) || (me && me.role==='owner' && !r.assignee && (r.status||'접수·견적')==='접수·견적')){
      out.push({r,kind:'new',dd:ddayInfo(dueOf(r))}); done.add(r.id);
    }
  });
  const ord={over:0,soon:1,new:2};
  out.sort((a,b)=>ord[a.kind]-ord[b.kind]);
  return out;
}
function renderBell(){
  const c=document.getElementById('bellCount'); if(!c) return;
  const n=computeNotifs().length;
  c.textContent=n; c.style.display=n?'inline-flex':'none';

function toggleBell(){
  const p=document.getElementById('bellPanel');
  if(p.style.display==='block'){ p.style.display='none'; return; }
  const list=computeNotifs();

    const tag=n.kind==='over'?'<span class="ntag over">지남</span>':n.kind==='soon'?'<span class="ntag soon">임박</span>':'<span class="ntag new">새 의뢰</span>';
    return `<div class="nitem" data-id="${n.r.id}">${tag}<div class="nmain"><div class="nt">${esc(n.r.org_name)||'(이름없음)'}</div><div class="nsub">${n.r.assignee?esc(n.r.assignee)+' · ':''}${n.dd?n.dd.label:''}${n.r.due_date?' · '+n.r.due_date:''}</div></div></div>`;
  }).join('') : '<div class="nempty">새로운 알림이 없어요 🎉</div>';
  p.style.display='block';
  p.querySelectorAll('.nitem[data-id]').forEach(x=>x.addEventListener('click',()=>{p.style.display='none';openDetail(Number(x.dataset.id));}));

function pad2(n){return String(n).padStart(2,'0');}

function todayStr(){const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function shiftMonth(ym,delta){let[y,m]=ym.split('-').map(Number);m+=delta;while(m<1){m+=12;y--;}while(m>12){m-=12;y++;}return y+'-'+pad2(m);}

function fmtDate(s){if(!s)return"";const d=new Date(s);return d.toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}
function ddayInfo(due){
  if(!due)return null;
  const t=new Date(due+'T00:00:00'); if(isNaN(t.getTime()))return null;
  const now=new Date(); now.setHours(0,0,0,0);
  const diff=Math.round((t.getTime()-now.getTime())/86400000);
  if(diff===0)return{label:'D-Day',tone:'soon'};
  if(diff>0)return{label:'D-'+diff,tone:diff<=3?'soon':'normal'};
  return{label:'D+'+Math.abs(diff),tone:'over'};
}
function clProg(r){const cl=Array.isArray(r.checklist)?r.checklist:[];const total=cl.length;const done=cl.filter(c=>effStage(c)==='끝').length;return{done,total,pct:total?Math.round(done/total*100):0};}
function srcBadge(r){return r.source==='manual'?'<span class="src src-manual">직접</span>':'<span class="src src-web">폼</span>';}
function taskAssigneeOpts(cur){
  let o='<option value="">담당 미지정</option>';
  const list=assignees.slice(); if(cur&&!list.includes(cur))list.push(cur);
  list.forEach(n=>{o+=`<option value="${esc(n)}" ${n===cur?'selected':''}>${esc(n)}</option>`;});
  return o;
}
async function addComment(id,text){
  const r=rows.find(x=>x.id===id); if(!r)return;
  const list=Array.isArray(r.comments)?[...r.comments]:[];
  list.push({who:(me&&me.name)||'관리자',text,at:new Date().toISOString()});
  const {error}=await sb.from('requests').update({comments:list}).eq('id',id);
  if(error){alert('코멘트 저장 실패: '+error.message+'\n(comments 컬럼이 없으면 06_task_comments.sql 을 실행하세요)');return;}
  r.comments=list; openDetail(id);
}

  const p=clProg(r), dd=ddayInfo(dueOf(r));
  return `<div class="card" draggable="true" data-id="${r.id}">
    <div class="ct">${esc(r.org_name)||'(이름없음)'} ${srcBadge(r)}</div>
    <div class="cm">
      ${r.request_type?`<span class="ctype">${esc(r.request_type)}</span>`:''}
      ${r.assignee?`<span class="who">${esc(r.assignee)}</span>`:'<span class="dim">미지정</span>'}
      ${dd?`<span class="dday ${dd.tone}">${dd.label}</span>`:''}
    </div>
    ${p.total?`<div class="cbar-lab"><span>할일</span><span>${p.done}/${p.total} · ${p.pct}%</span></div><div class="cbar"><i style="width:${p.pct}%"></i></div>`:`<div class="cbar-lab" style="opacity:.55"><span>할일</span><span>없음</span></div>`}

function setBoardType(t){boardType=t;renderBoard();}
function todoBadge(kind,stage){
  if(kind==='task'){const c=STAGE_COLOR[stage]||['#eceff3','#5b6675'];return `<span class="ti-badge" style="background:${c[0]};color:${c[1]}">${esc(stage)}</span>`;}
  return `<span class="badge st-${esc(stage||'접수·견적')}">${esc(stage||'접수·견적')}</span>`;
}
function renderMyTodos(el){
  const meName=me&&me.name; const items=[];
  rows.forEach(r=>{(Array.isArray(r.checklist)?r.checklist:[]).forEach(t=>{if((t.a||'')===meName&&effStage(t)!=='끝')items.push({r,label:t.t,stage:effStage(t),due:t.due||'',kind:'task'});});});
  rows.forEach(r=>{if(r.assignee===meName&&(r.status||'')!=='완료')items.push({r,label:r.org_name||'(이름없음)',stage:r.status||'접수·견적',due:dueOf(r),kind:'proj'});});
  const today=todayStr();
  const bucket=due=>{if(!due)return 3;if(due<=today)return 0;const dd=ddayInfo(due);return (dd&&dd.tone==='soon')?1:2;};
  items.forEach(it=>it.b=bucket(it.due));
  items.sort((a,b)=>a.b!==b.b?a.b-b.b:(!a.due?1:!b.due?-1:(a.due<b.due?-1:1)));
  const secs=[{k:0,t:'🔴 지남 · 오늘 마감',c:'over'},{k:1,t:'🟠 임박 (3일 이내)',c:'soon'},{k:2,t:'📌 예정',c:''},{k:3,t:'🗓 기한 없음',c:'muted'}];
  let body='';
  secs.forEach(sec=>{const list=items.filter(it=>it.b===sec.k);if(!list.length)return;
    body+=`<div class="todo-sec"><div class="todo-h ${sec.c}">${sec.t}<span>${list.length}</span></div>`+
      list.map(it=>{const dd=it.due?ddayInfo(it.due):null;return `<div class="todo-item" data-id="${it.r.id}">
        ${todoBadge(it.kind,it.stage)}
        <span class="ti-t">${esc(it.label)} <span class="dim" style="font-weight:400;font-size:.78rem">· ${esc(it.r.org_name)||''}${it.kind==='proj'?' · 프로젝트':''}</span></span>
        ${dd?`<span class="dday ${dd.tone}">${dd.label}${it.due?' · '+it.due:''}</span>`:'<span class="dim" style="font-size:.76rem">기한 없음</span>'}
      </div>`;}).join('')+'</div>';
  });
  if(!items.length) body='<div class="dim" style="padding:24px;text-align:center">나에게 배정된 진행중 업무가 없어요 🎉</div>';
  el.innerHTML=`<div class="todo-top"><b>${esc(meName||'내')} 님의 할 일</b><span class="dim"> · 급한 순</span></div><div class="todo">${body}</div>`;
  el.querySelectorAll('.todo-item[data-id]').forEach(x=>x.addEventListener('click',()=>openDetail(Number(x.dataset.id))));
}
function renderBoard(){
  const el=document.getElementById('boardView');
  if(scope==='mine'&&me&&me.name){ return renderMyTodos(el); }
  const rows0=scopedRows();
  const rows = boardType==='전체'?rows0:rows0.filter(r=>(r.request_type||'홈페이지')===boardType);
  // 유형 필터 칩
  const chips='<div class="btype">'+BOARD_TYPES.map(t=>`<button class="${boardType===t?'on':''}" data-btype="${esc(t)}">${t}</button>`).join('')+'</div>';
  // 다가오는 마감
  const up=rows.filter(r=>dueOf(r)&&(r.status||'')!=='완료')
    .map(r=>({r,dd:ddayInfo(dueOf(r))}))
    .filter(x=>x.dd&&x.dd.tone!=='normal')
    .sort((a,b)=>dueOf(a.r)<dueOf(b.r)?-1:1).slice(0,8);
  const upHtml=up.length
    ? '<div class="updue-h">📅 다가오는 마감</div><div class="updue">'+
      up.map(x=>`<div class="u" data-id="${x.r.id}"><span>${esc(x.r.org_name)||'(이름없음)'}</span><span class="dday ${x.dd.tone}">${x.dd.label}</span></div>`).join('')+'</div>'
    : '';
  // 활성 칼럼 (완료 제외)
  const active=rows.filter(r=>(r.status||'접수·견적')!=='완료');
  let colDefs;
  if(boardType==='전체'){
    colDefs=MACRO_ACTIVE.map(m=>({label:m,st:null,items:active.filter(r=>macroStatus(r)===m)}));
  } else {
    const stages=activeStages(boardType); const idx={}; stages.forEach((s,i)=>idx[s]=i);
    colDefs=stages.map(s=>({label:s,st:s,items:[]}));
    active.forEach(r=>{ const s=r.status; const t=(idx[s]!=null)?s:(stages[1]||stages[0]); colDefs[idx[t]].items.push(r); });
  }
  const cols=colDefs.map(c=>`<div class="col"${c.st?` data-st="${esc(c.st)}"`:''}><h3>${c.label}<span class="c">${c.items.length}</span></h3>${c.items.map(boardCard).join('')}</div>`).join('');
  const doneAll=rows.filter(r=>(r.status||'')==='완료').sort((a,b)=>(b.done_at||b.created_at||'').localeCompare(a.done_at||a.created_at||''));
  const dTotal=doneAll.length, dShown=showAllDone?doneAll:doneAll.slice(0,12);
  const doneStrip=`<div class="donebar" data-st="완료">
    <div class="donebar-h"><span>✅ 완료 <b>${dTotal}</b></span>${dTotal>12?`<button class="donemore" data-more="${showAllDone?0:1}">${showAllDone?'접기':'+ '+(dTotal-12)+'건 더'}</button>`:''}</div>
    <div class="donebar-list">${dTotal?dShown.map(r=>`<button class="donechip" data-id="${r.id}">${esc(r.org_name)||'(이름없음)'}<span class="dim">${r.done_at||''}</span></button>`).join(''):'<span class="dim">완료된 프로젝트가 없어요.</span>'}</div>
  </div>`;
  el.innerHTML=chips+upHtml+'<div class="board" style="grid-template-columns:repeat('+colDefs.length+',minmax(0,1fr))">'+cols+'</div>'+doneStrip;
  el.querySelectorAll('.btype button').forEach(b=>b.addEventListener('click',()=>setBoardType(b.dataset.btype)));
  el.querySelectorAll('[data-more]').forEach(b=>b.addEventListener('click',()=>{showAllDone=b.dataset.more==='1';renderBoard();}));
  el.querySelectorAll('.updue .u, .donechip').forEach(u=>u.addEventListener('click',()=>openDetail(Number(u.dataset.id))));
  let dragId=null;
  el.querySelectorAll('.card').forEach(c=>{
    c.addEventListener('click',()=>{if(!c.dataset.dragging)openDetail(Number(c.dataset.id));});
    c.addEventListener('dragstart',e=>{dragId=Number(c.dataset.id);c.dataset.dragging='1';e.dataTransfer.effectAllowed='move';});
    c.addEventListener('dragend',()=>{setTimeout(()=>{delete c.dataset.dragging;},60);});
  });
  el.querySelectorAll('.col[data-st], .donebar').forEach(col=>{
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('drag');});
    col.addEventListener('dragleave',()=>col.classList.remove('drag'));
    col.addEventListener('drop',async e=>{e.preventDefault();col.classList.remove('drag');if(dragId==null)return;await changeStatus(dragId,col.dataset.st);dragId=null;});
  });
}

function bindDetail(r){
  document.getElementById('mX').addEventListener('click',closeModal);
  document.getElementById('f_type').addEventListener('change',async e=>{await saveField(r.id,{request_type:e.target.value});openDetail(r.id);});
  sheet.querySelectorAll('.statusbar button').forEach(b=>b.addEventListener('click',()=>changeStatus(r.id,b.dataset.s,true)));
  const sel=document.getElementById('f_assignee');
  sel.addEventListener('change',()=>saveField(r.id,{assignee:sel.value||null}));
  sheet.querySelectorAll('.sdue').forEach(inp=>inp.addEventListener('change',()=>{
    const sd=Object.assign({},r.stage_due||{}); const st=inp.dataset.stage;
    if(inp.value) sd[st]=inp.value; else delete sd[st];
    saveField(r.id,{stage_due:sd, due_date: sd['완료']||null});
  }));
  document.getElementById('f_amount').addEventListener('blur',e=>{const v=e.target.value.trim();saveField(r.id,{amount:v===''?null:Number(v)});});
  document.getElementById('f_paid').addEventListener('change',e=>{const patch={paid:e.target.checked};if(e.target.checked&&!document.getElementById('f_paid_at').value)patch.paid_at=todayStr();saveField(r.id,patch);openDetail(r.id);});
  document.getElementById('f_paid_at').addEventListener('change',e=>saveField(r.id,{paid_at:e.target.value||null}));
  document.getElementById('f_site').addEventListener('blur',e=>saveField(r.id,{site_url:e.target.value.trim()}));
  document.getElementById('f_notes').addEventListener('blur',e=>saveField(r.id,{notes:e.target.value}));
  // imflow 단계형 작업 보드
  sheet.querySelectorAll('.tasklist .tstage').forEach(s=>s.addEventListener('change',()=>{const cl=r.checklist.map(x=>({...x}));const i=Number(s.dataset.i);cl[i].s=s.value;delete cl[i].d;saveChecklist(r.id,cl);}));
  sheet.querySelectorAll('.tasklist .tdue').forEach(d=>d.addEventListener('change',()=>{const cl=r.checklist.map(x=>({...x}));const i=Number(d.dataset.i);if(d.value)cl[i].due=d.value;else delete cl[i].due;saveChecklist(r.id,cl);}));
  sheet.querySelectorAll('.tasklist .ta').forEach(s=>s.addEventListener('change',()=>{const cl=r.checklist.map(x=>({...x}));cl[Number(s.dataset.i)].a=s.value;saveChecklist(r.id,cl);}));
  sheet.querySelectorAll('.tasklist .rm').forEach(b=>b.addEventListener('click',()=>{const cl=r.checklist.map(x=>({...x}));cl.splice(Number(b.dataset.i),1);saveChecklist(r.id,cl);}));
  const tf=sheet.querySelector('.tadd'); if(tf)tf.addEventListener('submit',e=>{e.preventDefault();const inp=tf.querySelector('input');const t=inp.value.trim();if(!t)return;const cl=Array.isArray(r.checklist)?r.checklist.map(x=>({...x})):[];cl.push({t,s:'해야함',a:r.assignee||''});saveChecklist(r.id,cl);});
  const cmAdd=()=>{const inp=document.getElementById('cmInput');const t=inp.value.trim();if(!t)return;addComment(r.id,t);};
  const cmBtn=document.getElementById('cmAdd'); if(cmBtn)cmBtn.addEventListener('click',cmAdd);
  const cmIn=document.getElementById('cmInput'); if(cmIn)cmIn.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();cmAdd();}});
  document.getElementById('copyBtn').addEventListener('click',async e=>{
    const t=buildText(r); try{await navigator.clipboard.writeText(t);}catch(_){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}ta.remove();}
    const b=e.currentTarget,o=b.textContent;b.classList.add('ok');b.textContent='✓ 복사되었습니다!';setTimeout(()=>{b.classList.remove('ok');b.textContent=o;},1600);
  });
  document.getElementById('quoteBtn').addEventListener('click',()=>{
    const p=new URLSearchParams({
      org:r.org_name||'', name:r.contact_name||'', phone:r.phone||'', email:r.email||'',
      mode:r.mode||'', lang:'ko'
    });
    window.open('quote.html?'+p.toString(),'_blank');
  });
  document.getElementById('delBtn').addEventListener('click',()=>del(r.id));
}

function flashSaved(){const m=document.getElementById('savedMsg');if(!m)return;m.classList.add('show');setTimeout(()=>m.classList.remove('show'),1200);}
async function saveField(id,patch){
  const {error}=await sb.from('requests').update(patch).eq('id',id);
  if(error){alert('저장 실패: '+error.message);return;}
  const r=rows.find(x=>x.id===id); if(r)Object.assign(r,patch);
  flashSaved(); renderSummary(); if(view==='list')renderList();else renderBoard();
}
async function saveChecklist(id,cl){
  const {error}=await sb.from('requests').update({checklist:cl}).eq('id',id);
  if(error){alert('저장 실패: '+error.message);return;}
  const r=rows.find(x=>x.id===id); if(r)r.checklist=cl; openDetail(id);
}
async function changeStatus(id,s,keepOpen){
  const r0=rows.find(x=>x.id===id);
  const patch={status:s};
  if(s==='완료' && r0 && !r0.done_at) patch.done_at=todayStr();
  const {error}=await sb.from('requests').update(patch).eq('id',id);
  if(error){alert('상태 변경 실패: '+error.message);return;}
  const r=rows.find(x=>x.id===id); if(r){r.status=s; if(patch.done_at)r.done_at=patch.done_at;}
  if(r){ const list=Array.isArray(r.comments)?[...r.comments]:[]; list.push({who:(me&&me.name)||'관리자',text:`상태를 '${s}'(으)로 변경`,at:new Date().toISOString(),sys:true}); const up=await sb.from('requests').update({comments:list}).eq('id',id); if(!up.error) r.comments=list; }
  renderSummary(); render(); if(keepOpen)openDetail(id);
}
async function del(id){
  if(!confirm('이 의뢰를 삭제할까요? 되돌릴 수 없습니다.'))return;
  const {error}=await sb.from('requests').delete().eq('id',id);
  if(error){alert('삭제 실패: '+error.message);return;}
  rows=rows.filter(x=>x.id!==id); closeModal(); renderSummary(); render();
}

const addModal=document.getElementById('addModal');
document.getElementById('addBtn').addEventListener('click',()=>addModal.classList.add('show'));
document.getElementById('addX').addEventListener('click',()=>addModal.classList.remove('show'));
addModal.addEventListener('click',e=>{if(e.target===addModal)addModal.classList.remove('show');});
document.getElementById('addSave').addEventListener('click',async()=>{
  const org=document.getElementById('a_org').value.trim(); const err=document.getElementById('addErr');
  if(!org){err.textContent="단체/사업체명을 입력하세요.";return;}
  const assignee=document.getElementById('a_assignee').value.trim();
  const row={status:'접수·견적',source:'manual',mode:document.getElementById('a_mode').value,org_name:org,assignee:assignee||null,
    request_type:document.getElementById('a_type').value,
    phone:document.getElementById('a_phone').value.trim(),email:document.getElementById('a_email').value.trim(),
    field:document.getElementById('a_field').value.trim(),notes:document.getElementById('a_notes').value.trim()};
  const {error}=await sb.from('requests').insert([row]);
  if(error){err.textContent="추가 실패: "+error.message;return;}
  ['a_org','a_assignee','a_phone','a_email','a_field','a_notes'].forEach(i=>document.getElementById(i).value='');
  err.textContent=""; addModal.classList.remove('show'); loadAll();
});

function buildText(r){
  const L=[]; L.push('['+(r.request_type||'홈페이지')+' 제작 의뢰]');
  if(r.mode) L.push('제작 방식: '+(MODE_LABEL[r.mode]||r.mode||''));
  L.push('상태: '+(r.status||'접수·견적')+(r.assignee?(' / 담당: '+r.assignee):''));
  const add=(k,v)=>{if(v)L.push(k+': '+v);};
  add('단체/사업체명',r.org_name); add('대표자',r.contact_name); add('전화',r.phone); add('이메일',r.email); add('분야',r.field);
  if(r.details) L.push('— 상세 —\n'+r.details);
  add((r.mode==='keep'?'기존 홈페이지':'참고 홈페이지'),r.ref_url);
  add('목적',r.purpose); add('방문자',r.audience); add('바라는 행동',r.goal);
  add('메뉴',r.pages); add('보유 자료',r.assets); add('소개글',r.intro); add('주소·운영시간·연락처',r.contact_info);
  add('디자인 느낌',r.mood); add('색상',r.colors); add('참고 사이트',r.ref_sites);
  add('기능',r.features); add('도메인 보유',r.domain); add('원하는 주소',r.domain_want); add('수정 선호',r.edit_pref);
  add('완료 시기',r.timeline); add('예산',r.budget); add('기타 요청',r.etc);
  add('제작 사이트',r.site_url); add('진행 메모',r.notes);
  return L.join('\n');
}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
