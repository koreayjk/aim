<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@IM — 앱 개발</title>
<meta name="description" content="@IM이 개발한 모바일·웹 앱 모음.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
:root{
  --bg:#eef2f9; --panel:#ffffff; --ink:#15294d; --muted:#6e7891; --line:#dde3ec;
  --violet:#1f3f73; --violet2:#15294d; --soft:#e9eef7;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Pretendard','Hanken Grotesk','Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;word-break:keep-all;overflow-wrap:break-word;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(760px 460px at 86% -6%,rgba(31,63,115,.12),transparent 60%),radial-gradient(640px 460px at 4% 16%,rgba(31,63,115,.07),transparent 56%)}
h1,h2,h3,.serif{font-family:'Fraunces','Pretendard','Noto Sans KR',serif}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}
.wrap{max-width:1180px;margin:0 auto;padding:0 26px}

header{position:sticky;top:0;z-index:50;background:rgba(247,246,251,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 26px;max-width:1180px;margin:0 auto}
.brand{display:flex;align-items:center;gap:11px}
.blogo{height:40px;width:auto;border-radius:9px;display:block}
.frow .blogo{height:30px;border-radius:7px}

.brand .mk{width:38px;height:38px;border-radius:11px;background:var(--ink);display:grid;place-items:center}
.brand .mk b{font-family:'Fraunces',serif;font-weight:700;font-size:1rem;color:#fff;letter-spacing:.4px}
.brand .nm b{font-family:'Fraunces',serif;font-weight:600;font-size:1.1rem}
.brand .nm span{display:block;font-size:.6rem;letter-spacing:3px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:1px}
.nav-right{display:flex;align-items:center;gap:12px}
.home-link{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:.85rem;color:var(--muted);border:1px solid var(--line);background:var(--panel);padding:8px 15px;border-radius:30px;transition:.2s}
.home-link:hover{color:var(--violet);border-color:var(--violet)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:30px;padding:3px;background:var(--panel)}
.lang button{border:none;background:transparent;color:var(--muted);font-family:inherit;font-weight:700;font-size:.78rem;padding:7px 12px;border-radius:24px;cursor:pointer;transition:.2s}
.lang button.on{background:var(--ink);color:#fff}

.hero{padding:78px 0 50px;text-align:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.72rem;letter-spacing:2.5px;text-transform:uppercase;color:var(--violet);background:var(--panel);border:1px solid var(--line);padding:8px 16px;border-radius:30px}
.hero h1{font-size:clamp(2.4rem,5.4vw,4rem);line-height:1.05;font-weight:500;letter-spacing:-1.2px;margin:22px 0 16px}
.hero h1 em{font-style:italic;color:var(--violet)}
.hero p{font-size:1.06rem;color:var(--muted);max-width:540px;margin:0 auto}

.sec{padding:30px 0 40px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.proj{opacity:0;transform:translateY(24px);transition:.7s cubic-bezier(.2,.7,.2,1)}
.proj.in{opacity:1;transform:none}
.win{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;height:100%;box-shadow:0 24px 50px -34px rgba(27,24,48,.3);transition:.35s}
.proj:hover .win{transform:translateY(-8px);border-color:rgba(31,63,115,.35);box-shadow:0 40px 70px -36px rgba(27,24,48,.4)}
.bar{display:flex;align-items:center;gap:12px;padding:12px 15px;background:#f6f4fb;border-bottom:1px solid var(--line)}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;display:block}
.dots i:nth-child(1){background:#e08b82}.dots i:nth-child(2){background:#e6c266}.dots i:nth-child(3){background:#6cc189}
.url{flex:1;background:#fff;border:1px solid var(--line);border-radius:7px;padding:5px 12px;font-size:.76rem;color:var(--muted);white-space:nowrap;overflow:hidden}
.url b{color:var(--ink);font-weight:600}
.shot{position:relative;aspect-ratio:16/10;background:linear-gradient(135deg,#e3def4,#efedf7);overflow:hidden}
.shot img{width:100%;height:100%;object-fit:cover}
.shot .ph{position:absolute;inset:0;display:grid;place-items:center;color:#b3aad2}
.shot .ph svg{width:50px;height:50px}
.meta{padding:20px}
.meta h3{font-size:1.3rem;font-weight:600}
.meta .loc{font-size:.85rem;color:var(--muted);margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.tag{font-size:.72rem;font-weight:600;color:var(--muted);border:1px solid var(--line);padding:4px 11px;border-radius:20px}

.ghost .win{background:transparent;border:1.5px dashed #cfc9e6;box-shadow:none;display:flex;align-items:center;justify-content:center;min-height:300px}
.proj.ghost:hover .win{transform:translateY(-6px);border-color:var(--violet)}
.gin{text-align:center;padding:40px 26px}
.gin .plus{width:56px;height:56px;margin:0 auto 16px;border-radius:50%;border:1.5px dashed #bbb1de;display:grid;place-items:center;color:var(--violet);font-size:1.6rem;font-family:'Fraunces',serif}
.gin h3{font-size:1.12rem;font-weight:600;margin-bottom:6px}
.gin p{color:var(--muted);font-size:.86rem}

.cta{margin:60px 0 80px}
.cta-box{border:1px solid var(--line);border-radius:26px;padding:64px 40px;text-align:center;background:linear-gradient(140deg,rgba(31,63,115,.08),rgba(31,63,115,.02))}
.cta-box h2{font-size:clamp(1.8rem,3.6vw,2.6rem);font-weight:500;letter-spacing:-.8px;margin-bottom:12px}
.cta-box h2 em{font-style:italic;color:var(--violet)}
.cta-box p{color:var(--muted);max-width:460px;margin:0 auto 26px}
.cta-box .btn{display:inline-flex;align-items:center;gap:9px;background:var(--violet);color:#fff;font-weight:700;padding:14px 30px;border-radius:40px;transition:.25s;box-shadow:0 16px 32px -14px rgba(31,63,115,.6)}
.cta-box .btn:hover{background:var(--violet2);transform:translateY(-2px)}

footer{border-top:1px solid var(--line);padding:34px 0}
.frow{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.84rem}

@media(max-width:900px){ .grid{grid-template-columns:1fr 1fr} }
@media(max-width:620px){ .grid{grid-template-columns:1fr} .home-link span{display:none} }
</style>
</head>
<body>

<header>
  <nav>
    <a class="brand" href="../"><img class="blogo" src="logo.jpg" alt="@IM — IM America Group Corp"></a>
    <div class="nav-right">
      <a class="home-link" href="../">&larr; <span data-i18n="home">홈</span></a>
      <div class="lang" id="lang"><button data-lang="ko" class="on">한국어</button><button data-lang="en">EN</button></div>
    </div>
  </nav>
</header>

<main>
  <section class="hero wrap">
    <span class="eyebrow">&#10022; <span data-i18n="eyebrow">@IM Apps</span></span>
    <h1 data-i18n="h1">앱 <em>개발</em></h1>
    <p data-i18n="sub">모바일·웹 앱을 기획하고 개발합니다. @IM이 만든 앱을 이곳에 모읍니다.</p>
  </section>

  <section class="sec wrap"><div class="grid" id="grid"></div></section>

  <section class="cta wrap">
    <div class="cta-box">
      <h2 data-i18n="ctaTitle">앱 아이디어가 <em>있으신가요?</em></h2>
      <p data-i18n="ctaSub">모바일·웹 앱, @IM이 기획부터 출시까지 함께합니다.</p>
      <a class="btn" href="mailto:?subject=@IM 앱 개발 문의"><span data-i18n="ctaBtn">앱 개발 문의</span> &#8599;</a>
    </div>
  </section>

  <footer class="wrap">
    <div class="frow"><img class="blogo flogo" src="logo.jpg" alt="@IM"><span data-i18n="copyright">© 2026 IM America Group Corp · Texas, USA</span></div>
  </footer>
</main>

<script src="apps.js"></script>
<script>
/* ====================================================
   앱 목록은 apps.js 의 APPS 에서 관리합니다.
   카드를 누르면 detail.html?id=… 소개 페이지로 이동하고,
   소개 페이지에서 App Store · Google Play 로 설치합니다.
   ==================================================== */
const PROJECTS = window.APPS || [];
const pick=(v,l)=>v&&typeof v==='object'&&!Array.isArray(v)?(v[l]||v.ko||''):(v||'');
const T = {
  ko:{ title:"@IM — 앱 개발", home:"홈", eyebrow:"@IM Apps",
       h1:"앱 <em>개발</em>",
       sub:"모바일·웹 앱을 기획하고 개발합니다. @IM이 만든 앱을 이곳에 모읍니다.",
       visit:"앱 보기", ghostT:"준비 중", ghostP:"곧 새로운 앱이 올라옵니다.",
       ctaTitle:"앱 아이디어가 <em>있으신가요?</em>", ctaSub:"모바일·웹 앱, @IM이 기획부터 출시까지 함께합니다.",
       ctaBtn:"앱 개발 문의", copyright:"© 2026 IM America Group Corp · Texas, USA" },
  en:{ title:"@IM — App Development", home:"Home", eyebrow:"@IM Apps",
       h1:"App <em>development</em>",
       sub:"We design and develop mobile & web apps. @IM's apps live here.",
       visit:"View app", ghostT:"Coming soon", ghostP:"New apps will appear here shortly.",
       ctaTitle:"Got an <em>app idea?</em>", ctaSub:"Mobile & web apps — @IM takes you from concept to launch.",
       ctaBtn:"Start an app", copyright:"© 2025 @IM · Web & Software · Texas, USA" }
};

const grid=document.getElementById('grid');
let firstPaint=true;
function renderGrid(lang){
  grid.innerHTML=''; const t=T[lang];
  PROJECTS.forEach(p=>{
    const shot=(p.cover||p.url)?`<img src="${p.cover||('https://image.thum.io/get/width/1200/crop/800/'+p.url)}" alt="${p.name}" loading="lazy" onerror="this.style.display='none'">`:`<div class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg></div>`;
    const tg=(lang==='en'?(p.tagsEn||p.tags):p.tags)||[];
    const tags=tg.map(x=>`<span class="tag">${x}</span>`).join('');
    const el=document.createElement('a'); el.className='proj'; el.href='detail.html?id='+encodeURIComponent(p.id);
    el.innerHTML=`<div class="win"><div class="bar"><span class="dots"><i></i><i></i><i></i></span><span class="url"><b>${p.path}</b></span></div><div class="shot">${shot}</div><div class="meta"><h3>${p.name}</h3><div class="loc">${pick(p.loc,lang)}</div><div class="tags">${tags}</div></div></div>`;
    grid.appendChild(el);
  });
  const ghostN = PROJECTS.length ? 1 : 3;
  for(let i=0;i<ghostN;i++){
    const g=document.createElement('div'); g.className='proj ghost';
    g.innerHTML=`<div class="win"><div class="gin"><div class="plus">+</div><h3>${t.ghostT}</h3><p>${t.ghostP}</p></div></div>`;
    grid.appendChild(g);
  }
  const cards=grid.querySelectorAll('.proj');
  if(firstPaint){ const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.1}); cards.forEach(c=>io.observe(c)); firstPaint=false; }
  else cards.forEach(c=>c.classList.add('in'));
}
function setLang(l){ const t=T[l]; document.documentElement.lang=l; try{localStorage.setItem('imLang',l)}catch(e){} document.title=t.title;
  document.querySelectorAll('[data-i18n]').forEach(e=>{const k=e.getAttribute('data-i18n'); if(t[k]!==undefined) e.innerHTML=t[k];});
  document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.lang===l));
  renderGrid(l);
}
document.querySelectorAll('#lang button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
(function(){var l='ko';try{var s=localStorage.getItem('imLang');if(s)l=s}catch(e){}var u=new URLSearchParams(location.search).get('lang');if(u)l=u;if(l!=='ko'&&l!=='en')l='ko';setLang(l)})();
</script>
</body>
</html>
