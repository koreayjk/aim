<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@IM — 앱 소개</title>
<meta name="description" content="@IM이 만든 앱 소개 — 주요 기능과 App Store · Google Play 설치">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
:root{
  --bg:#eef2f9; --panel:#ffffff; --ink:#15294d; --muted:#6e7891; --line:#dde3ec;
  --violet:#1f3f73; --violet2:#15294d; --soft:#e9eef7; --gold:#b9760a;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Pretendard','Hanken Grotesk','Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;word-break:keep-all;overflow-wrap:break-word;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(760px 460px at 86% -6%,rgba(31,63,115,.12),transparent 60%),radial-gradient(640px 460px at 4% 16%,rgba(31,63,115,.07),transparent 56%)}
h1,h2,h3,.serif{font-family:'Fraunces','Pretendard','Noto Sans KR',serif}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}
.wrap{max-width:1180px;margin:0 auto;padding:0 26px}

header{position:sticky;top:0;z-index:50;background:rgba(247,246,251,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 26px;max-width:1180px;margin:0 auto}
.brand{display:flex;align-items:center;gap:11px}
.blogo{height:40px;width:auto;border-radius:9px;display:block}
.frow .blogo{height:30px;border-radius:7px}
.nav-right{display:flex;align-items:center;gap:12px}
.home-link{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:.85rem;color:var(--muted);border:1px solid var(--line);background:var(--panel);padding:8px 15px;border-radius:30px;transition:.2s}
.home-link:hover{color:var(--violet);border-color:var(--violet)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:30px;padding:3px;background:var(--panel)}
.lang button{border:none;background:transparent;color:var(--muted);font-family:inherit;font-weight:700;font-size:.78rem;padding:7px 12px;border-radius:24px;cursor:pointer;transition:.2s}
.lang button.on{background:var(--ink);color:#fff}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:52px;align-items:center;padding:64px 0 40px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.72rem;letter-spacing:2px;text-transform:uppercase;color:var(--violet);background:var(--panel);border:1px solid var(--line);padding:7px 14px;border-radius:30px}
.hero h1{font-size:clamp(2.3rem,4.8vw,3.6rem);line-height:1.06;font-weight:600;letter-spacing:-1px;margin:18px 0 14px}
.tagline{font-size:1.12rem;color:var(--ink);font-weight:600;margin-bottom:10px}
.desc{color:var(--muted);font-size:1rem;max-width:540px}
.stores{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.store{display:inline-flex;align-items:center;gap:11px;background:#0f1b33;color:#fff;border-radius:13px;padding:10px 20px 10px 16px;min-width:190px;transition:.22s;box-shadow:0 16px 30px -18px rgba(15,27,51,.7)}
.store:hover{transform:translateY(-2px);background:#000}
.store svg{width:26px;height:26px;flex:none;fill:currentColor}
.store span{display:flex;flex-direction:column;line-height:1.15}
.store small{font-size:.68rem;opacity:.8;font-weight:500}
.store b{font-size:1.08rem;font-weight:700;letter-spacing:-.2px;white-space:nowrap}
.store.off{background:var(--panel);color:var(--muted);border:1.5px dashed #c3cbdb;box-shadow:none;cursor:default}
.store.off:hover{transform:none;background:var(--panel)}
.weblink{display:inline-flex;align-items:center;gap:6px;margin-top:16px;font-size:.88rem;font-weight:600;color:var(--violet)}
.weblink:hover{text-decoration:underline}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:22px}
.tag{font-size:.74rem;font-weight:600;color:var(--muted);border:1px solid var(--line);background:var(--panel);padding:4px 11px;border-radius:20px}

.device{background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 40px 80px -44px rgba(27,24,48,.45)}
.bar{display:flex;align-items:center;gap:12px;padding:12px 15px;background:#f6f4fb;border-bottom:1px solid var(--line)}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;display:block}
.dots i:nth-child(1){background:#e08b82}.dots i:nth-child(2){background:#e6c266}.dots i:nth-child(3){background:#6cc189}
.url{flex:1;background:#fff;border:1px solid var(--line);border-radius:7px;padding:5px 12px;font-size:.76rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.url b{color:var(--ink);font-weight:600}
.shot{position:relative;aspect-ratio:16/10;background:linear-gradient(135deg,#e3e8f4,#eef1f8);overflow:hidden}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot .ph{position:absolute;inset:0;display:grid;place-items:center;font-family:'Fraunces',serif;font-size:2.4rem;font-weight:700;color:#b3bdd6}

/* sections */
.sec{padding:34px 0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:22px}
.sec-h h2{font-size:clamp(1.6rem,3vw,2.1rem);font-weight:600;letter-spacing:-.5px}
.sec-h p{color:var(--muted);font-size:.92rem}
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.feat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px 22px;box-shadow:0 20px 44px -36px rgba(27,24,48,.35)}
.feat .n{width:36px;height:36px;border-radius:11px;background:var(--soft);color:var(--violet);display:grid;place-items:center;font-weight:800;font-size:.95rem;margin-bottom:14px}
.feat h3{font-family:'Pretendard','Hanken Grotesk','Noto Sans KR',sans-serif;font-size:1.06rem;font-weight:700;margin-bottom:6px}
.feat p{color:var(--muted);font-size:.9rem}
.who{display:flex;flex-wrap:wrap;gap:10px}
.who span{background:var(--panel);border:1px solid var(--line);border-radius:30px;padding:9px 16px;font-size:.9rem;font-weight:600}

.others{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.other{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;transition:.22s}
.other:hover{border-color:rgba(31,63,115,.4);transform:translateY(-3px)}
.other b{display:block;font-size:.98rem}
.other span{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}

.cta{margin:40px 0 70px}
.cta-box{border:1px solid var(--line);border-radius:26px;padding:54px 40px;text-align:center;background:linear-gradient(140deg,rgba(31,63,115,.08),rgba(31,63,115,.02))}
.cta-box h2{font-size:clamp(1.7rem,3.4vw,2.4rem);font-weight:500;letter-spacing:-.8px;margin-bottom:12px}
.cta-box h2 em{font-style:italic;color:var(--violet)}
.cta-box p{color:var(--muted);max-width:460px;margin:0 auto 24px}
.cta-box .btn{display:inline-flex;align-items:center;gap:9px;background:var(--violet);color:#fff;font-weight:700;padding:14px 30px;border-radius:40px;transition:.25s;box-shadow:0 16px 32px -14px rgba(31,63,115,.6)}
.cta-box .btn:hover{background:var(--violet2);transform:translateY(-2px)}

.missing{text-align:center;padding:120px 0}
.missing h1{font-size:2rem;margin-bottom:12px}
.missing a{color:var(--violet);font-weight:700}

footer{border-top:1px solid var(--line);padding:34px 0}
.frow{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.84rem}

@media(max-width:900px){ .hero{grid-template-columns:1fr;gap:34px;padding-top:44px} .feats{grid-template-columns:1fr 1fr} .others{grid-template-columns:1fr 1fr} }
@media(max-width:620px){ .wrap{padding:0 16px} nav{padding:13px 16px} .feats,.others{grid-template-columns:1fr} .home-link span{display:none} .store{flex:1;min-width:0;padding:10px 12px;gap:8px} .store b{font-size:.98rem} .store svg{width:22px;height:22px} .sec-h{flex-direction:column;gap:4px} }
</style>
</head>
<body>

<header>
  <nav>
    <a class="brand" href="../"><img class="blogo" src="logo.jpg" alt="@IM"></a>
    <div class="nav-right">
      <a class="home-link" href="./">&larr; <span data-i18n="back">앱 목록</span></a>
      <div class="lang" id="lang"><button data-lang="ko" class="on">한국어</button><button data-lang="en">EN</button></div>
    </div>
  </nav>
</header>

<main id="main" class="wrap"></main>

<footer class="wrap">
  <div class="frow"><img class="blogo" src="logo.jpg" alt="@IM"><span data-i18n="copyright">© 2026 IM America Group Corp · Texas, USA</span></div>
</footer>

<script src="apps.js"></script>
<script>
const T = {
  ko:{ back:"앱 목록", features:"주요 기능", featuresSub:"이 앱으로 할 수 있는 일", who:"이런 분께 추천해요",
       others:"다른 앱 둘러보기", appStoreS:"Download on the", playS:"GET IT ON", soon:"출시 예정",
       web:"웹 버전 열기", noApp:"앱을 찾을 수 없어요", noAppLink:"앱 목록으로 돌아가기",
       ctaTitle:"앱 아이디어가 <em>있으신가요?</em>", ctaSub:"모바일·웹 앱, @IM이 기획부터 스토어 출시까지 함께합니다.",
       ctaBtn:"앱 개발 문의", copyright:"© 2026 IM America Group Corp · Texas, USA", titleSuffix:" — @IM 앱" },
  en:{ back:"All apps", features:"Key features", featuresSub:"What you can do with this app", who:"Made for",
       others:"More apps", appStoreS:"Download on the", playS:"GET IT ON", soon:"Coming soon",
       web:"Open web version", noApp:"App not found", noAppLink:"Back to all apps",
       ctaTitle:"Got an <em>app idea?</em>", ctaSub:"Mobile & web apps — @IM takes you from concept to store launch.",
       ctaBtn:"Start an app", copyright:"© 2026 IM America Group Corp · Texas, USA", titleSuffix:" — @IM Apps" }
};
const ICON_APPLE='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>';
const ICON_PLAY='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22.018 13.298l-3.919 2.218-3.515-3.493 3.543-3.521 3.891 2.202a1.49 1.49 0 0 1 0 2.594zM1.337.924a1.486 1.486 0 0 0-.112.568v21.017c0 .217.045.419.124.6l11.155-11.087L1.337.924zm12.207 10.065l3.258-3.238L3.45.195a1.466 1.466 0 0 0-.946-.179l11.04 10.973zm0 2.067l-11 10.933c.298.036.612-.016.906-.183l13.324-7.54-3.23-3.21z"/></svg>';

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pick=(v,l)=>v&&typeof v==='object'&&!Array.isArray(v)?(v[l]||v.ko||''):(v||'');
const id=new URLSearchParams(location.search).get('id');

function storeBtn(url,icon,small,big,t){
  if(url) return `<a class="store" href="${esc(url)}" target="_blank" rel="noopener">${icon}<span><small>${small}</small><b>${big}</b></span></a>`;
  return `<span class="store off" aria-disabled="true">${icon}<span><small>${t.soon}</small><b>${big}</b></span></span>`;
}

function render(l){
  const t=T[l], main=document.getElementById('main');
  const a=(window.APPS||[]).find(x=>x.id===id);
  if(!a){
    document.title=t.noApp+t.titleSuffix;
    main.innerHTML=`<div class="missing"><h1>${t.noApp}</h1><a href="./">← ${t.noAppLink}</a></div>`;
    return;
  }
  document.title=a.name+t.titleSuffix;
  const cover=a.cover||(a.url?'https://image.thum.io/get/width/1200/crop/800/'+a.url:'');
  const shot=`<div class="ph">${esc(a.name.charAt(0))}</div>`+(cover?`<img src="${esc(cover)}" alt="${esc(a.name)}" onerror="this.remove()">`:'');
  const tags=((l==='en'?(a.tagsEn||a.tags):a.tags)||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('');
  const feats=(a.features||[]).map((f,i)=>`<div class="feat"><div class="n">${String(i+1).padStart(2,'0')}</div><h3>${esc(pick(f.t,l))}</h3><p>${esc(pick(f.d,l))}</p></div>`).join('');
  const who=(pick(a.audience,l)||[]).map(x=>`<span>${esc(x)}</span>`).join('');
  const others=(window.APPS||[]).filter(x=>x.id!==a.id).map(x=>`<a class="other" href="detail.html?id=${encodeURIComponent(x.id)}"><b>${esc(x.name)}</b><span>${esc(pick(x.loc,l))}</span></a>`).join('');
  main.innerHTML=`
  <section class="hero">
    <div>
      <span class="eyebrow">${esc(pick(a.loc,l))}</span>
      <h1>${esc(a.name)}</h1>
      <p class="tagline">${esc(pick(a.tagline,l))}</p>
      <p class="desc">${esc(pick(a.desc,l))}</p>
      <div class="stores">
        ${storeBtn(a.appStore,ICON_APPLE,t.appStoreS,'App Store',t)}
        ${storeBtn(a.playStore,ICON_PLAY,t.playS,'Google Play',t)}
      </div>
      ${a.url?`<a class="weblink" href="${esc(a.url)}" target="_blank" rel="noopener">${t.web} &#8599;</a>`:''}
      <div class="tags">${tags}</div>
    </div>
    <div class="device"><div class="bar"><span class="dots"><i></i><i></i><i></i></span><span class="url"><b>${esc(a.path||'')}</b></span></div><div class="shot">${shot}</div></div>
  </section>
  ${feats?`<section class="sec"><div class="sec-h"><h2>${t.features}</h2><p>${t.featuresSub}</p></div><div class="feats">${feats}</div></section>`:''}
  ${who?`<section class="sec"><div class="sec-h"><h2>${t.who}</h2></div><div class="who">${who}</div></section>`:''}
  ${others?`<section class="sec"><div class="sec-h"><h2>${t.others}</h2></div><div class="others">${others}</div></section>`:''}
  <section class="cta"><div class="cta-box"><h2>${t.ctaTitle}</h2><p>${t.ctaSub}</p><a class="btn" href="mailto:admin@imamericagroup.com?subject=@IM 앱 개발 문의">${t.ctaBtn} &#8599;</a></div></section>`;
}

function setLang(l){
  const t=T[l]; document.documentElement.lang=l; try{localStorage.setItem('imLang',l)}catch(e){}
  document.querySelectorAll('[data-i18n]').forEach(e=>{const k=e.getAttribute('data-i18n'); if(t[k]!==undefined) e.innerHTML=t[k];});
  document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.lang===l));
  render(l);
}
document.querySelectorAll('#lang button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
(function(){var l='ko';try{var s=localStorage.getItem('imLang');if(s)l=s}catch(e){}var u=new URLSearchParams(location.search).get('lang');if(u)l=u;if(l!=='ko'&&l!=='en')l='ko';setLang(l)})();
</script>
</body>
</html>
