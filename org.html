<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="@IM 회사 조직도">
<title>@IM — 조직도 / Organization</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#eef2f9;--panel:#fff;--ink:#15294d;--ink2:#3e4a5b;--muted:#6e7891;--line:#dde3ec;--navy:#1f3f73;--soft:#eef2f9;--err:#c0392b}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard','Hanken Grotesk','Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Fraunces','Pretendard',serif}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:10;background:rgba(238,242,249,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav{max-width:1100px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:800}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:'Fraunces',serif}
.home-link{font-weight:600;color:var(--ink2);font-size:.9rem}.home-link:hover{color:var(--navy)}
.wrap{max-width:1100px;margin:0 auto;padding:34px 22px 70px}
.head h1{font-size:2rem;color:var(--navy)}
.head p{color:var(--muted);margin-top:6px}
.chart{margin-top:30px}
.tier-label{text-align:center;font-size:.7rem;font-weight:800;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin:2px 0 8px}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.stem{width:2px;height:24px;background:var(--line);margin:4px auto}
.gov{display:flex;gap:16px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.gov-main{display:flex;flex-direction:column;gap:10px;flex:1 1 auto;max-width:680px}
.gov-aside{border:1.5px dashed #c9d3e0;border-radius:12px;padding:8px 14px;background:#fbfbf9}
.gov-tier{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.gov-tier .gl{justify-self:end;font-size:.74rem;font-weight:800;color:var(--muted);white-space:nowrap}
.gov-tier .row{justify-self:center}
.gcard{background:linear-gradient(#fff,#f2f6fd);border:1px solid #cdddf3;border-radius:12px;padding:9px 16px;text-align:center;min-width:130px;box-shadow:0 10px 22px -18px rgba(0,0,0,.4)}
.gcard .n{font-weight:800;font-size:.92rem}.gcard .t{font-size:.74rem;color:var(--navy);font-weight:600}
.p{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 13px;box-shadow:0 10px 22px -18px rgba(0,0,0,.4)}
.p .av{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.82rem;flex:0 0 auto}
.p .pn{font-weight:700;font-size:.9rem}.p .pr{font-size:.72rem;color:var(--muted)}
.pm-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.pm-slot{border:1px dashed #c9d3e0;border-radius:12px;padding:8px 10px;min-width:200px;background:#fafbfc}
.pm-slot .sh{font-size:.7rem;font-weight:800;text-align:center;margin-bottom:6px}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:6px}
.col{background:#fafbfc;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-height:120px}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:10px 13px;background:var(--panel);border-bottom:1px solid var(--line)}
.col-h .ct{font-weight:800}.col-h .cc{font-size:.72rem;color:var(--muted);font-weight:700}
.col-b{padding:9px;display:flex;flex-direction:column;gap:9px;flex:1}
.dir-empty,.mem-empty{font-size:.74rem;color:var(--muted);text-align:center;padding:10px 4px;border:1px dashed var(--line);border-radius:9px}
.bench{margin-top:18px;background:#fafbfc;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.bench .bh{font-weight:800;font-size:.82rem;margin-bottom:8px}
.bench .row{justify-content:flex-start}
.loading{text-align:center;color:var(--muted);padding:60px 0}
.foot{max-width:1100px;margin:0 auto;padding:24px 22px;color:var(--muted);font-size:.82rem;border-top:1px solid var(--line)}
@media(max-width:560px){.gov-tier{grid-template-columns:1fr}.gov-tier .gl{justify-self:center}.board{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <nav>
    <a class="brand" href="./"><span class="logo">@</span><span>IM</span></a>
    <a class="home-link" href="./">&larr; 홈으로</a>
  </nav>
</header>
<div class="wrap">
  <div class="head"><h1>@IM 회사 조직도</h1><p>이사회 · 대표 · 부서 · 크루 전체 구성</p></div>
  <div id="chart" class="chart"><div class="loading">조직도를 불러오는 중…</div></div>
</div>
<div class="foot">© 2026 IM America Group Corp · Texas, USA</div>
<script>
const SUPABASE_URL="https://lnrugwschlcesaaertgc.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxucnVnd3NjaGxjZXNhYWVydGdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0ODczNzgsImV4cCI6MjA5NjA2MzM3OH0.JTpEUF2TO2NcuS1ak04hqd2IYfZ2bYn40L3EaLIwVGw";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{db:{schema:'aim'}});
const DEPTS=['디자인','테크','마케팅'];
const DEPT_DIRECTOR={'디자인':'디자인 디렉터','테크':'테크 디렉터','마케팅':'마케팅 디렉터'};
const DEPT_COLOR={'디자인':'#6a48c0','테크':'#1f3f73','마케팅':'#b9760a'};
const DIRECTORS=['디자인 디렉터','테크 디렉터','마케팅 디렉터'];
const PM_RANKS=['한국 PM','글로벌 PM','프로젝트 매니저'];
const isPMrank=r=>PM_RANKS.includes(r||'');
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function initials(n){n=(n||'').trim();return n?n[0].toUpperCase():'?';}
function gcard(m){return `<div class="gcard"><div class="n">${esc(m.name||'')}</div><div class="t">${esc(m.title||'')}${m.scope?` · ${esc(m.scope)}`:''}</div></div>`;}
function pcard(s,isDir){const role=isDir?'디렉터':((s.rank||'크루')==='크루'?'크루':esc(s.rank||''));return `<div class="p"><span class="av">${esc(initials(s.name))}</span><div><div class="pn">${esc(s.name||'')}</div><div class="pr">${role}</div></div></div>`;}
function render(data){
  const staff=data.staff||[], members=data.members||[];
  const boss=staff.filter(s=>(s.rank||'')==='대표');
  const isDir=s=>DIRECTORS.includes(s.rank||'');
  const crew=staff.filter(s=>(s.rank||'')!=='대표'&&!isPMrank(s.rank));
  const pmAll=staff.filter(s=>isPMrank(s.rank));
  const chair=members.filter(m=>m.tier==='chair');
  const board=members.filter(m=>m.tier!=='chair'&&m.tier!=='advisory'&&m.tier!=='ceo');
  const advisory=members.filter(m=>m.tier==='advisory');
  const ceoM=members.filter(m=>m.tier==='ceo');
  const unassigned=crew.filter(s=>!s.department);
  const govMain=`<div class="gov-main">
    ${chair.length?`<div class="gov-tier"><span class="gl">이사장 · 부이사장</span><div class="row">${chair.map(gcard).join('')}</div><span></span></div>`:''}
    ${board.length?`${chair.length?'<div class="stem"></div>':''}<div class="gov-tier"><span class="gl">이사</span><div class="row">${board.map(gcard).join('')}</div><span></span></div>`:''}
  </div>`;
  const gov=(chair.length||board.length||advisory.length)?`<div class="gov">${govMain}${advisory.length?`<div class="gov-aside"><div class="tier-label">감사 · 자문</div><div class="row">${advisory.map(gcard).join('')}</div></div>`:''}</div><div class="stem"></div>`:'';
  const pmSlots=['글로벌 PM','한국 PM'].map(r=>{const hold=pmAll.filter(s=>s.rank===r);return `<div class="pm-slot"><div class="sh" style="color:${r==='한국 PM'?'#33507e':'#1e7d6b'}">${r}</div>${hold.length?hold.map(s=>pcard(s,false)).join(''):'<div class="mem-empty">미지정</div>'}</div>`;}).join('');
  const cols=DEPTS.map(d=>{
    const inD=crew.filter(s=>s.department===d);
    const heads=inD.filter(isDir), mem=inD.filter(s=>!isDir(s));
    return `<div class="col"><div class="col-h" style="box-shadow:inset 0 3px 0 ${DEPT_COLOR[d]}"><span class="ct">${d}</span><span class="cc">${inD.length}명</span></div><div class="col-b">${heads.length?heads.map(s=>pcard(s,true)).join(''):'<div class="dir-empty">디렉터 미지정</div>'}${mem.length?mem.map(s=>pcard(s,false)).join(''):''}</div></div>`;
  }).join('');
  const el=document.getElementById('chart');
  el.innerHTML=`${gov}
    <div class="tier-label">대표 · CEO</div>
    <div class="row">${(ceoM.length||boss.length)?(ceoM.map(gcard).join('')+boss.map(s=>pcard(s,false)).join('')):'<div class="mem-empty">대표 미지정</div>'}</div>
    <div class="stem"></div>
    <div class="tier-label">프로젝트 매니저 · PM</div>
    <div class="pm-row">${pmSlots}</div>
    <div class="stem"></div>
    <div class="board">${cols}</div>
    ${unassigned.length?`<div class="bench"><div class="bh">미배정 크루 · ${unassigned.length}명</div><div class="row">${unassigned.map(s=>pcard(s,false)).join('')}</div></div>`:''}`;
}
sb.rpc('org_public').then(({data,error})=>{
  if(error||!data){document.getElementById('chart').innerHTML='<div class="loading">조직도를 불러오지 못했어요.<br><span style="font-size:.8rem">(org_public 함수가 없으면 25_org_public.sql 을 실행하세요)</span></div>';return;}
  render(typeof data==='string'?JSON.parse(data):data);
});
</script>
</body>
</html>
